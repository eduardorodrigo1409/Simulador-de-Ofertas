  <script type="text/babel">

    const SALES_LOG_KEY = "promocoes_vendas_simulador_v3";
    const CATALOG_STORAGE_KEY = "promocoes_catalogo_sankhya_v3";

    // Base inicial com itens reais da apuração de estoque / Sankhya

      "481": {
        codigo: "481",
        descricao: "COLUNA 8,0MM (7X14)",

      },

        codigo: "477",
        descricao: "COLUNA 10,0MM (7X14)",
        grupo: "COLUNAS",
        estoqueDisp: 0,

      },
      "1924": {
        codigo: "1924",
        descricao: "VERGALHÃO CA-50 10.0MM 3/8 RETO (12M)",
        grupo: "VERGALHAO CA 50",
        estoqueDisp: 13942.7,
        custoUnit: 4.55,
      },

    function toInputDate(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
    }

    function formatDatePtBr(dateStr) {
      const d = parseLocalDate(dateStr);
      if (!d) return "—";
      return d.toLocaleDateString("pt-BR");
    }

    function formatBRL(value) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatNumber(value, decimals = 0) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function parsePtNumber(raw) {
      if (typeof raw === "number") return Number.isFinite(raw) ? raw : 0;
      if (!raw) return 0;
      const cleaned = String(raw)
        .replace(/R\$/gi, "")
        .replace(/\s+/g, "")
        .trim();
      if (!cleaned) return 0;
      if (cleaned.includes(",") && cleaned.includes(".")) {
        const val = Number(cleaned.replace(/\./g, "").replace(",", "."));
        return Number.isFinite(val) ? val : 0;
      }
      if (cleaned.includes(",")) {
        const val = Number(cleaned.replace(",", "."));
        return Number.isFinite(val) ? val : 0;
      }
      const val = Number(cleaned);
      return Number.isFinite(val) ? val : 0;
    }

    function normalizarItemEstoque(raw) {
      if (!raw || typeof raw !== "object") return null;
      const codigo = String(
        raw.codigo ?? raw.CODPROD ?? raw.sku ?? raw.id ?? ""
      ).trim();
      if (!codigo) return null;

      return {
        codigo,
        descricao: String(
          raw.descricao ?? raw.produto ?? raw.DESCRPROD ?? raw.nome ?? `SKU ${codigo}`
        ).trim(),
        grupo: String(
          raw.grupo ?? raw.GRUPOPROD ?? raw.categoria ?? "SANKHYA"
        ).trim(),
        custoUnit: parsePtNumber(
          raw.custoUnit ??
            raw.unidadeCusto ??
            raw.custo_unitario ??
            raw.custo ??
            raw.vlrCusto ??
            0
        ),
        estoqueDisp: parsePtNumber(
          raw.estoqueDisp ??
            raw.qtdDisponivel ??
            raw.qtd_disponivel ??
            raw.estoque ??
            raw.saldo ??
            0
        ),
      };
    }

    function extrairArrayDePayload(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object") {
        if (Array.isArray(data.itens)) return data.itens;
        if (Array.isArray(data.items)) return data.items;
        if (Array.isArray(data.produtos)) return data.produtos;
        if (Array.isArray(data.estoque)) return data.estoque;
        if (Array.isArray(data.dados)) return data.dados;
      }
      return [];
    }

    function calcPrecoFromMarkup(custo, markupPct) {
      const m = Number.isFinite(markupPct) ? markupPct : 0;
      return Math.max(0, Number((custo * (1 + m / 100)).toFixed(2)));
    }

    function calcMarkupFromPreco(custo, preco) {
      if (!custo || custo <= 0) return 0;
      return Number((((preco - custo) / custo) * 100).toFixed(2));
    }

    function calcMargemPct(preco, custo) {
      if (!preco || preco <= 0) return 0;
      return Number((((preco - custo) / preco) * 100).toFixed(1));
    }

    function criarItemPromocao(skuObj, markupInicial = 25, qtdOferta = 10) {
      const custo = Number(skuObj.custoUnit) || 0;
      const precoOferta = calcPrecoFromMarkup(custo, markupInicial);
      return {
        codigo: String(skuObj.codigo).trim(),
        descricao: String(skuObj.descricao || "").trim(),
        grupo: String(skuObj.grupo || "GERAL").trim(),
        estoqueDisp: Number(skuObj.estoqueDisp) || 0,
        custoUnit: custo,
        qtdOferta: Math.max(0, Number(qtdOferta) || 0),
        markupPct: Number(markupInicial) || 0,
        precoOferta,
      };
    }

    function parseTextoImportacaoSankhya(texto) {
      const linhas = String(texto || "")
        .split(/?
/)
        .map((l) => l.trim())
        .filter(Boolean);

      if (linhas.length === 0) return [];

      const sep = linhas[0].includes("	")
        ? "	"
        : linhas[0].includes(";")
        ? ";"
        : ",";

      const resultados = [];

      linhas.forEach((linha, idx) => {
        const cols = linha.split(sep).map((c) => c.trim());
        if (cols.length < 2) return;

        const primeiroLower = cols[0].toLowerCase();
        if (
          idx === 0 &&
          (primeiroLower.includes("codigo") ||
            primeiroLower.includes("código") ||
            primeiroLower.includes("sku") ||
            primeiroLower === "#")
        ) {
          return;
        }

        const temColunaSeq =
          cols.length >= 6 &&
          /^\d+$/.test(cols[0]) &&
          /^\d+$/.test(cols[1]);

        const codigoIdx = temColunaSeq && cols.length >= 7 ? 1 : 0;
        const codigo = cols[codigoIdx]?.trim();
        if (!codigo) return;

        const descricao = cols[codigoIdx + 1]?.trim() || `Item SKU ${codigo}`;
        const grupo = cols[codigoIdx + 2]?.trim() || "SANKHYA";

        const numeros = cols.slice(codigoIdx + 3).map((c) => parsePtNumber(c));

        const custoUnit =
          numeros.length >= 2 ? numeros[numeros.length - 2] : numeros[0] || 0;
        const estoqueDisp =
          numeros.length >= 1 ? numeros[numeros.length - 1] : 0;

        resultados.push({
          codigo,
          descricao,
          grupo,
          custoUnit,
          estoqueDisp,
        });
      });

      return resultados;
    }

    function gerarVendasExemplo() {
      const hoje = new Date();
      hoje.setHours(12, 0, 0, 0);

      const makeSale = (daysAgo, codigo, qtd, precoPraticado) => {
        const dt = new Date(hoje);
        dt.setDate(dt.getDate() - daysAgo);
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const day = String(dt.getDate()).padStart(2, "0");
        return {
          id: `${codigo}-${daysAgo}-${Math.random().toString(36).slice(2, 7)}`,
          data: `${y}-${m}-${day}`,
          codigo: String(codigo),
          qtd,
          precoPraticado,
        };
      };

      return [
        makeSale(5, "481", 45, 61.7),
        makeSale(4, "481", 38, 61.7),
        makeSale(3, "481", 52, 61.7),
        makeSale(2, "481", 40, 61.7),
        makeSale(1, "481", 49, 61.7),
        makeSale(0, "481", 36, 61.7),

        makeSale(5, "1924", 420, 5.69),
        makeSale(4, "1924", 510, 5.69),
        makeSale(3, "1924", 390, 5.69),
        makeSale(2, "1924", 460, 5.69),
        makeSale(1, "1924", 540, 5.69),
        makeSale(0, "1924", 380, 5.69),

        makeSale(4, "479", 12, 94.25),
        makeSale(2, "479", 15, 94.25),
        makeSale(0, "479", 9, 94.25),
      ];
    }

    function criarCampanhasIniciais(catalogoBase) {
      const itensIniciais = [
        criarItemPromocao(catalogoBase["481"], 25, 400),
        criarItemPromocao(catalogoBase["1924"], 25, 4500),
        criarItemPromocao(catalogoBase["479"], 25, 80),
      ];

      return [
        {
          id: "camp-queima-sankhya",
          nome: "Queima de Estoque — Sankhya",
          markupInicial: 25,
          dataInicio: toInputDate(-5),
          dataFim: toInputDate(4),
          atualizadoEm: new Date().toISOString(),
          itens: itensIniciais,
        },
        {
          id: "camp-excesso-colunas",
          nome: "Liquidação Excesso — Colunas",
          markupInicial: 20,
          dataInicio: toInputDate(3),
          dataFim: toInputDate(10),
          atualizadoEm: new Date().toISOString(),
          itens: [
            criarItemPromocao(catalogoBase["481"], 20, 300),
            criarItemPromocao(catalogoBase["479"], 20, 70),
          ],
        },
      ];
    }

    function getStatusCampanha(dataInicio, dataFim) {
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);

      if (!inicio) {
        return {
          key: "sem_data",
          label: "Sem Data Início",
          badgeClass: "bg-slate-800 text-slate-300 border-slate-700",
          iniciada: false,
        };
      }

      if (hoje < inicio) {
        return {
          key: "agendada",
          label: "Agendada",
          badgeClass: "bg-sky-950/80 text-sky-300 border-sky-700/60",
          iniciada: false,
        };
      }

      if (fim && hoje > fim) {
        return {
          key: "encerrada",
          label: "Encerrada",
          badgeClass: "bg-amber-950/80 text-amber-300 border-amber-700/60",
          iniciada: true,
        };
      }

      return {
        key: "ativa",
        label: "Em Andamento",
        badgeClass: "bg-emerald-950/80 text-emerald-300 border-emerald-600/60",
        iniciada: true,
      };
    }

    function getDiasDecorridos(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      if (!inicio) return 0;

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      if (hoje < inicio) return 0;

      const fim = parseLocalDate(dataFim);
      const limite = fim && hoje > fim ? fim : hoje;
      const diffMs = limite.getTime() - inicio.getTime();
      return Math.max(1, Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1);
    }

    function getDiasTotaisCampanha(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);
      if (!inicio || !fim || fim < inicio) return null;
      const diffMs = fim.getTime() - inicio.getTime();
      return Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
    }

    function exportarCsvPromocao({
      nomePromocao,
      dataInicio,
      dataFim,
      linhasPerformance,
      iniciada,
    }) {
      const headers = [
        "Campanha",
        "Data Inicio",
        "Data Fim",
        "Codigo SKU",
        "Descricao",
        "Grupo",
        "Estoque Disp.",
        "Custo Unit. (R$)",
        "Qtd Oferta",
        "Markup (%)",
        "Preco Oferta (R$)",
        "Margem Oferta (%)",
        "Total Oferta (R$)",
        ...(iniciada
          ? [
              "Qtd Vendida",
              "% Atingido",
              "Saldo Restante",
              "Media Venda/Dia",
              "Receita Realizada (R$)",
              "Ritmo",
            ]
          : []),
      ];

      const escapeCsv = (val) => {
        const str = String(val ?? "");
        if (str.includes(";") || str.includes('"') || str.includes("
")) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      const rows = linhasPerformance.map((item) => [
        nomePromocao || "Promocao sem nome",
        dataInicio || "",
        dataFim || "",
        item.codigo,
        item.descricao,
        item.grupo,
        item.estoqueDisp,
        item.custoUnit.toFixed(2).replace(".", ","),
        item.qtdOferta,
        item.markupPct.toFixed(2).replace(".", ","),
        item.precoOferta.toFixed(2).replace(".", ","),
        item.margemPct.toFixed(1).replace(".", ","),
        item.totalOferta.toFixed(2).replace(".", ","),
        ...(iniciada
          ? [
              item.qtdVendida,
              item.pctAtingido.toFixed(1).replace(".", ","),
              item.saldoRestante,
              item.mediaDia.toFixed(2).replace(".", ","),
              item.receitaRealizada.toFixed(2).replace(".", ","),
              item.ritmoLabel,
            ]
          : []),
      ]);

      const csvContent =
        "﻿" +
        [headers, ...rows]
          .map((row) => row.map(escapeCsv).join(";"))
          .join("
");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const slug = (nomePromocao || "promocao")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      link.href = url;
      link.setAttribute("download", `${slug || "promocao"}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function PromocoesDashboard() {
      const [catalogoSankhya, setCatalogoSankhya] = useState(() => {
        try {
          const saved = localStorage.getItem(CATALOG_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === "object" && Object.keys(parsed).length > 0) {
              return parsed;
            }
          }
        } catch {
          // ignora erro de storage
        }
        return CATALOGO_SANKHYA_INICIAL;
      });

      const [ultimaSincronizacao, setUltimaSincronizacao] = useState(() => {
        try {
          const allStockRaw = localStorage.getItem(ALL_STOCK_PAYLOAD_KEY);
          if (allStockRaw) {
            const parsed = JSON.parse(allStockRaw);
            if (parsed && parsed.atualizadoEm) return parsed.atualizadoEm;
          }
        } catch {
          // ignora
        }
        return null;
      });

      const [syncUrl, setSyncUrl] = useState(() => {
        try {
          return localStorage.getItem(SYNC_URL_STORAGE_KEY) || "";
        } catch {
          return "";
        }
      });

      const [campanhas, setCampanhas] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch {
          // ignora erro de storage
        }
        return criarCampanhasIniciais(catalogoSankhya);
      });

      const [vendas, setVendas] = useState(() => {
        try {
          const saved = localStorage.getItem(SALES_LOG_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {
          // ignora erro de storage
        }
        return gerarVendasExemplo();
      });

      const [campanhaAtivaId, setCampanhaAtivaId] = useState(
        () => campanhas[0]?.id || null
      );

      const [nomePromocao, setNomePromocao] = useState(
        () => campanhas[0]?.nome || "Queima de Estoque — Sankhya"
      );
      const [markupInicial, setMarkupInicial] = useState(
        () => campanhas[0]?.markupInicial ?? 25
      );
      const [dataInicio, setDataInicio] = useState(
        () => campanhas[0]?.dataInicio || toInputDate(-5)
      );
      const [dataFim, setDataFim] = useState(
        () => campanhas[0]?.dataFim || toInputDate(4)
      );
      const [itens, setItens] = useState(() => campanhas[0]?.itens || []);

      const [skuInput, setSkuInput] = useState("");
      const [feedback, setFeedback] = useState(null);
      const [filtroGrupo, setFiltroGrupo] = useState("TODOS");
      const [somenteComSaida, setSomenteComSaida] = useState(false);

      const [mostrarImportador, setMostrarImportador] = useState(false);
      const [textoImportacao, setTextoImportacao] = useState(
        "481	COLUNA 8,0MM (7X14)	COLUNAS	49,36	478
477	COLUNA 10,0MM (7X14)	COLUNAS	73,72	0
1924	VERGALHÃO CA-50 10.0MM 3/8 RETO (12M)	VERGALHAO CA 50	4,55	13.942,7
479	COLUNA 10,0MM (7X20)	COLUNAS	75,40	94"
      );

      const [simSku, setSimSku] = useState("481");
      const [simQtd, setSimQtd] = useState(15);
      const [simData, setSimData] = useState(() => toInputDate(0));

      const skuInputRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(catalogoSankhya));
        } catch {
          // ignora erro de storage
        }
      }, [catalogoSankhya]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(campanhas));
        } catch {
          // ignora erro de storage
        }
      }, [campanhas]);

      useEffect(() => {
        try {
          localStorage.setItem(SALES_LOG_KEY, JSON.stringify(vendas));
        } catch {
          // ignora erro de storage
        }
      }, [vendas]);

      useEffect(() => {
        try {
          localStorage.setItem(SYNC_URL_STORAGE_KEY, syncUrl);
        } catch {
          // ignora
        }
      }, [syncUrl]);

      const sincronizarCatalogoCompleto = (listaRaw, origemLabel = "Dash Apuração de Estoque") => {
        const arr = extrairArrayDePayload(listaRaw);
        const normalizados = arr.map(normalizarItemEstoque).filter(Boolean);

        if (normalizados.length === 0) return 0;

        const novoCatalogo = {};
        normalizados.forEach((n) => {
          novoCatalogo[n.codigo] = n;
        });

        const agoraIso = new Date().toISOString();
        setCatalogoSankhya(novoCatalogo);
        setUltimaSincronizacao(agoraIso);

        try {
          localStorage.setItem(
            ALL_STOCK_PAYLOAD_KEY,
            JSON.stringify({
              atualizadoEm: agoraIso,
              origem: origemLabel,
              itens: normalizados,
            })
          );
        } catch {
          // ignora
        }

        // Atualiza dados de estoque e custo dos itens que já estão na lista atual
        setItens((prev) =>
          prev.map((item) => {
            const atual = novoCatalogo[item.codigo];
            if (!atual) return item;
            return {
              ...item,
              descricao: atual.descricao,
              grupo: atual.grupo,
              estoqueDisp: atual.estoqueDisp,
              custoUnit: atual.custoUnit,
              precoOferta: calcPrecoFromMarkup(atual.custoUnit, item.markupPct),
            };
          })
        );

        if (normalizados[0]?.codigo) {
          setSimSku(normalizados[0].codigo);
        }

        return normalizados.length;
      };

      // Escuta mensagens postMessage, alterações de localStorage e hash (#todos=... ou #dados=...)
      useEffect(() => {
        const aplicarPayloadExterno = (rawData, carregarNaPromocao = false, origem = "Dash Estoque") => {
          if (!rawData) return;
          const arr = extrairArrayDePayload(rawData);
          const normalizados = arr.map(normalizarItemEstoque).filter(Boolean);
          if (normalizados.length === 0) return;

          const qtdSincronizada = sincronizarCatalogoCompleto(normalizados, origem);

          if (carregarNaPromocao) {
            const m = Number(markupInicial) || 25;
            setItens(
              normalizados.map((n) =>
                criarItemPromocao(
                  n,
                  m,
                  n.estoqueDisp > 0 ? Math.max(1, Math.round(n.estoqueDisp)) : 10
                )
              )
            );
            setFeedback({
              type: "success",
              text: `${qtdSincronizada} item(ns) sincronizado(s) do ${origem} e carregado(s) na promoção.`,
            });
          } else {
            setFeedback({
              type: "success",
              text: `Catálogo sincronizado com ${qtdSincronizada} item(ns) completos do ${origem}.`,
            });
          }
        };

        try {
          // 1. Hash da URL (#todos=... ou #dados=...)
          if (window.location.hash && window.location.hash.startsWith("#todos=")) {
            const rawHash = decodeURIComponent(window.location.hash.slice(7));
            aplicarPayloadExterno(JSON.parse(rawHash), false, "Hash URL (Todos os Itens)");
          } else if (window.location.hash && window.location.hash.startsWith("#dados=")) {
            const rawHash = decodeURIComponent(window.location.hash.slice(7));
            aplicarPayloadExterno(JSON.parse(rawHash), true, "Excesso para Queima");
          }

          // 2. Todos os itens sincronizados do Dash de Apuração de Estoque
          const allStockRaw = localStorage.getItem(ALL_STOCK_PAYLOAD_KEY);
          if (allStockRaw) {
            const parsedAll = JSON.parse(allStockRaw);
            const arrAll = extrairArrayDePayload(parsedAll);
            if (arrAll.length > 0) {
              sincronizarCatalogoCompleto(
                arrAll,
                parsedAll.origem || "Dash Apuração de Estoque"
              );
            }
          }

          // 3. Itens enviados especificamente para queima
          const bridgeRaw = localStorage.getItem(BRIDGE_PAYLOAD_KEY);
          if (bridgeRaw) {
            const parsedBridge = JSON.parse(bridgeRaw);
            const arrBridge = extrairArrayDePayload(parsedBridge);
            if (arrBridge.length > 0) {
              aplicarPayloadExterno(arrBridge, true, "Excesso para Queima");
              localStorage.removeItem(BRIDGE_PAYLOAD_KEY);
            }
          }
        } catch {
          // ignora erro de leitura inicial
        }

        const handleMessage = (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== "object") return;
          if (msg.tipo === "SYNC_ESTOQUE_COMPLETO" || msg.type === "SYNC_ESTOQUE_COMPLETO") {
            const qtd = sincronizarCatalogoCompleto(
              msg.itens || msg.dados || [],
              msg.origem || "Dash Apuração de Estoque"
            );
            if (qtd > 0) {
              setFeedback({
                type: "success",
                text: `Sincronização automática: ${qtd} item(ns) recebidos do Dash de Apuração de Estoque.`,
              });
            }
          } else if (
            msg.tipo === "ENVIAR_QUEIMA" ||
            msg.type === "ENVIAR_QUEIMA" ||
            msg.tipo === "CARREGAR_PROMOCAO"
          ) {
            aplicarPayloadExterno(
              msg.itens || msg.dados || [],
              true,
              msg.origem || "Excesso para Queima"
            );
          }
        };

        const handleStorageEvent = (event) => {
          if (event.key === ALL_STOCK_PAYLOAD_KEY && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              const qtd = sincronizarCatalogoCompleto(
                extrairArrayDePayload(parsed),
                parsed.origem || "Dash Apuração de Estoque"
              );
              if (qtd > 0) {
                setFeedback({
                  type: "success",
                  text: `Lista completa atualizada: ${qtd} item(ns) do Dash de Apuração de Estoque.`,
                });
              }
            } catch {
              // ignora
            }
          } else if (event.key === BRIDGE_PAYLOAD_KEY && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              aplicarPayloadExterno(
                extrairArrayDePayload(parsed),
                true,
                "Excesso para Queima"
              );
            } catch {
              // ignora
            }
          }
        };

        window.addEventListener("message", handleMessage);
        window.addEventListener("storage", handleStorageEvent);
        return () => {
          window.removeEventListener("message", handleMessage);
          window.removeEventListener("storage", handleStorageEvent);
        };
      }, []);

      const handleBuscarUrlSincronizacao = async (e) => {
        if (e) e.preventDefault();
        const urlLimpa = syncUrl.trim();
        if (!urlLimpa) {
          showNotice(
            "error",
            "Informe a URL JSON/API ou endpoint que expõe os itens do Dash de Apuração de Estoque."
          );
          return;
        }
        try {
          const resp = await fetch(urlLimpa, { cache: "no-store" });
          if (!resp.ok) {
            showNotice("error", `Falha ao buscar URL (${resp.status}).`);
            return;
          }
          const data = await resp.json();
          const qtd = sincronizarCatalogoCompleto(data, "Endpoint de Estoque");
          if (qtd > 0) {
            showNotice(
              "success",
              `Sincronização concluída: ${qtd} item(ns) carregados no catálogo a partir da URL.`
            );
          } else {
            showNotice(
              "error",
              "A resposta JSON não continha itens válidos com código/SKU."
            );
          }
        } catch {
          showNotice(
            "error",
            "Não foi possível acessar a URL (verifique CORS ou formato JSON)."
          );
        }
      };

      const showNotice = (type, text) => {
        setFeedback({ type, text });
      };

      const aplicarListaImportada = (listaImportada, modoSubstituir = true) => {
        if (!Array.isArray(listaImportada) || listaImportada.length === 0) {
          showNotice(
            "error",
            "Nenhum item válido encontrado para importar. Verifique o formato (Código, Descrição, Grupo, Custo Unit., Estoque Disp.)."
          );
          return;
        }

        const normalizados = listaImportada
          .map(normalizarItemEstoque)
          .filter(Boolean);

        if (normalizados.length === 0) {
          showNotice("error", "Nenhum item válido encontrado após normalização.");
          return;
        }

        const qtd = sincronizarCatalogoCompleto(
          normalizados,
          "Importação Manual / Arquivo"
        );

        const m = Number(markupInicial) || 0;
        const novosItensPromo = normalizados.map((item) =>
          criarItemPromocao(
            item,
            m,
            item.estoqueDisp > 0 ? Math.max(1, Math.round(item.estoqueDisp)) : 10
          )
        );

        if (modoSubstituir) {
          setItens(novosItensPromo);
        } else {
          setItens((prev) => {
            const mapaAtual = new Map(prev.map((p) => [p.codigo, p]));
            novosItensPromo.forEach((ni) => {
              mapaAtual.set(ni.codigo, ni);
            });
            return Array.from(mapaAtual.values());
          });
        }

        setMostrarImportador(false);
        showNotice(
          "success",
          `${qtd} item(ns) sincronizado(s) no catálogo e carregado(s) na promoção.`
        );
      };

      const handleImportarTexto = (e) => {
        e.preventDefault();
        const parsed = parseTextoImportacaoSankhya(textoImportacao);
        aplicarListaImportada(parsed, true);
      };

      const handleArquivoImportado = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const conteudo = String(ev.target?.result || "");
          if (file.name.toLowerCase().endsWith(".json")) {
            try {
              const jsonData = JSON.parse(conteudo);
              const arr = extrairArrayDePayload(jsonData);
              aplicarListaImportada(arr, true);
              return;
            } catch {
              showNotice("error", "Arquivo JSON inválido.");
              return;
            }
          }
          setTextoImportacao(conteudo);
          const parsed = parseTextoImportacaoSankhya(conteudo);
          aplicarListaImportada(parsed, true);
        };
        reader.readAsText(file, "UTF-8");
        e.target.value = "";
      };

      const carregarCampanhaNoEditor = (camp) => {
        if (!camp) return;
        setCampanhaAtivaId(camp.id);
        setNomePromocao(camp.nome || "");
        setMarkupInicial(camp.markupInicial ?? 25);
        setDataInicio(camp.dataInicio || "");
        setDataFim(camp.dataFim || "");
        setItens(Array.isArray(camp.itens) ? camp.itens : []);
        setFeedback(null);
      };

      const handleNovaPromocao = () => {
        setCampanhaAtivaId(null);
        setNomePromocao("");
        setMarkupInicial(25);
        setDataInicio(toInputDate(0));
        setDataFim(toInputDate(7));
        setItens([]);
        setFiltroGrupo("TODOS");
        setSomenteComSaida(false);
        showNotice(
          "info",
          "Nova promoção iniciada. Preencha o nome, datas, digite qualquer SKU sincronizado ou importe e clique em Salvar Promoção."
        );
        skuInputRef.current?.focus();
      };

      const handleSalvarPromocao = () => {
        const nomeLimpo = nomePromocao.trim();
        if (!nomeLimpo) {
          showNotice("error", "Informe o Nome da Promoção / Campanha antes de salvar.");
          return;
        }
        if (!dataInicio) {
          showNotice("error", "Defina a Data de Início da promoção.");
          return;
        }
        if (dataFim && dataFim < dataInicio) {
          showNotice(
            "error",
            "A Data de Fim não pode ser anterior à Data de Início."
          );
          return;
        }
        if (itens.length === 0) {
          showNotice(
            "error",
            "Adicione pelo menos 1 item (SKU) antes de salvar a promoção."
          );
          return;
        }

        const idAlvo =
          campanhaAtivaId ||
          `camp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

        const novaCampanha = {
          id: idAlvo,
          nome: nomeLimpo,
          markupInicial: Number(markupInicial) || 0,
          dataInicio,
          dataFim,
          atualizadoEm: new Date().toISOString(),
          itens,
        };

        setCampanhas((prev) => {
          const exists = prev.some((c) => c.id === idAlvo);
          if (exists) {
            return prev.map((c) => (c.id === idAlvo ? novaCampanha : c));
          }
          return [novaCampanha, ...prev];
        });
        setCampanhaAtivaId(idAlvo);
        showNotice(
          "success",
          `Promoção "${nomeLimpo}" salva com sucesso (${itens.length} SKU${
            itens.length > 1 ? "s" : ""
          }).`
        );
      };

      const handleExcluirCampanha = () => {
        if (!campanhaAtivaId) return;
        const alvo = campanhas.find((c) => c.id === campanhaAtivaId);
        const restantes = campanhas.filter((c) => c.id !== campanhaAtivaId);
        setCampanhas(restantes);

        if (restantes.length > 0) {
          carregarCampanhaNoEditor(restantes[0]);
        } else {
          setCampanhaAtivaId(null);
          setNomePromocao("");
          setItens([]);
        }
        showNotice(
          "info",
          `Campanha "${alvo?.nome || "selecionada"}" removida.`
        );
      };

      const handleInserirSku = (e) => {
        if (e) e.preventDefault();
        const codigoLimpo = skuInput.trim();
        if (!codigoLimpo) return;

        const skuCatalogo = catalogoSankhya[codigoLimpo];
        if (!skuCatalogo) {
          showNotice(
            "error",
            `SKU "${codigoLimpo}" não encontrado na lista sincronizada do estoque (${Object.keys(
              catalogoSankhya
            ).length} itens disponíveis). Sincronize a lista completa do Dash de Apuração de Estoque ou use "Importar Sankhya".`
          );
          return;
        }

        const existente = itens.find((i) => i.codigo === skuCatalogo.codigo);
        if (existente) {
          setItens((prev) =>
            prev.map((item) =>
              item.codigo === skuCatalogo.codigo
                ? { ...item, qtdOferta: item.qtdOferta + 1 }
                : item
            )
          );
          showNotice(
            "success",
            `SKU ${skuCatalogo.codigo} já estava na lista: quantidade ofertada incrementada para ${
              existente.qtdOferta + 1
            }.`
          );
        } else {
          const novoItem = criarItemPromocao(
            skuCatalogo,
            Number(markupInicial) || 0,
            skuCatalogo.estoqueDisp > 0
              ? Math.min(50, Math.round(skuCatalogo.estoqueDisp))
              : 10
          );
          setItens((prev) => [...prev, novoItem]);
          showNotice(
            "success",
            `SKU ${skuCatalogo.codigo} (${skuCatalogo.descricao}) adicionado à promoção.`
          );
        }

        setSkuInput("");
        skuInputRef.current?.focus();
      };

      const handleAplicarMarkupEmTodos = () => {
        const m = Number(markupInicial) || 0;
        setItens((prev) =>
          prev.map((item) => ({
            ...item,
            markupPct: m,
            precoOferta: calcPrecoFromMarkup(item.custoUnit, m),
          }))
        );
        showNotice(
          "info",
          `Markup de ${m}% reaplicado em todos os ${itens.length} itens da lista.`
        );
      };

      const handleAtualizarQtdOferta = (codigo, novaQtd) => {
        const qtd = Math.max(0, Number(novaQtd) || 0);
        setItens((prev) =>
          prev.map((item) => (item.codigo === codigo ? { ...item, qtdOferta: qtd } : item))
        );
      };

      const handleAtualizarMarkupItem = (codigo, novoMarkup) => {
        const m = Number(novoMarkup);
        const markupVal = Number.isFinite(m) ? m : 0;
        setItens((prev) =>
          prev.map((item) =>
            item.codigo === codigo
              ? {
                  ...item,
                  markupPct: markupVal,
                  precoOferta: calcPrecoFromMarkup(item.custoUnit, markupVal),
                }
              : item
          )
        );
      };

      const handleAtualizarPrecoOferta = (codigo, novoPreco) => {
        const p = Number(novoPreco);
        const precoVal = Number.isFinite(p) ? Math.max(0, p) : 0;
        setItens((prev) =>
          prev.map((item) =>
            item.codigo === codigo
              ? {
                  ...item,
                  precoOferta: precoVal,
                  markupPct: calcMarkupFromPreco(item.custoUnit, precoVal),
                }
              : item
          )
        );
      };

      const handleRemoverItem = (codigo) => {
        setItens((prev) => prev.filter((item) => item.codigo !== codigo));
      };

      const handleLimparLista = () => {
        setItens([]);
        showNotice("info", "Lista de itens da promoção limpa.");
      };

      const handleRegistrarVendaSimulada = (e) => {
        e.preventDefault();
        const qtd = Math.max(1, Number(simQtd) || 1);
        const skuCatalogo = catalogoSankhya[simSku];
        if (!skuCatalogo || !simData) return;

        const itemEmPromocao = itens.find((i) => i.codigo === simSku);
        const precoPraticado = itemEmPromocao
          ? itemEmPromocao.precoOferta
          : calcPrecoFromMarkup(skuCatalogo.custoUnit, 25);

        const novaVenda = {
          id: `sale-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          data: simData,
          codigo: simSku,
          qtd,
          precoPraticado,
        };

        setVendas((prev) => [novaVenda, ...prev]);
        showNotice(
          "success",
          `Venda registrada: ${qtd} un. do SKU ${simSku} em ${formatDatePtBr(
            simData
          )} a ${formatBRL(precoPraticado)}.`
        );
      };

      const statusCampanha = useMemo(
        () => getStatusCampanha(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const diasDecorridos = useMemo(
        () => getDiasDecorridos(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const diasTotais = useMemo(
        () => getDiasTotaisCampanha(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const vendasNoPeriodo = useMemo(() => {
        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        const fim = parseLocalDate(dataFim);
        const hoje = new Date();
        hoje.setHours(23, 59, 59, 999);
        const limiteSuperior = fim
          ? new Date(fim.getFullYear(), fim.getMonth(), fim.getDate(), 23, 59, 59, 999)
          : hoje;

        return vendas.filter((v) => {
          const dt = parseLocalDate(v.data);
          if (!dt || !inicio) return false;
          return dt >= inicio && dt <= limiteSuperior;
        });
      }, [vendas, statusCampanha.iniciada, dataInicio, dataFim]);

      const linhasPerformance = useMemo(() => {
        return itens.map((item) => {
          const totalOferta = item.qtdOferta * item.precoOferta;
          const custoTotalItem = item.qtdOferta * item.custoUnit;
          const margemPct = calcMargemPct(item.precoOferta, item.custoUnit);

          const vendasSku = statusCampanha.iniciada
            ? vendasNoPeriodo.filter((v) => v.codigo === item.codigo)
            : [];

          const qtdVendida = vendasSku.reduce(
            (acc, v) => acc + (Number(v.qtd) || 0),
            0
          );
          const receitaRealizada = vendasSku.reduce(
            (acc, v) =>
              acc + (Number(v.qtd) || 0) * (Number(v.precoPraticado) || item.precoOferta),
            0
          );
          const custoRealizado = qtdVendida * item.custoUnit;
          const lucroRealizado = receitaRealizada - custoRealizado;
          const margemRealizadaPct =
            receitaRealizada > 0
              ? Number(
                  (((receitaRealizada - custoRealizado) / receitaRealizada) * 100).toFixed(
                    1
                  )
                )
              : 0;

          const pctAtingido =
            item.qtdOferta > 0
              ? Number(((qtdVendida / item.qtdOferta) * 100).toFixed(1))
              : 0;
          const saldoRestante = Math.max(0, item.qtdOferta - qtdVendida);
          const mediaDia =
            diasDecorridos > 0 ? Number((qtdVendida / diasDecorridos).toFixed(2)) : 0;

          const ritmoEsperadoDia =
            diasTotais && diasTotais > 0 && item.qtdOferta > 0
              ? item.qtdOferta / diasTotais
              : 0.5;

          let ritmoKey = "sem_saida";
          let ritmoLabel = "Sem saída";
          let ritmoClass = "bg-slate-800 text-slate-400 border-slate-700";

          if (qtdVendida > 0) {
            if (mediaDia >= ritmoEsperadoDia * 1.15) {
              ritmoKey = "acelerado";
              ritmoLabel = "Acelerado";
              ritmoClass = "bg-emerald-950/80 text-emerald-300 border-emerald-700/60";
            } else if (mediaDia >= ritmoEsperadoDia * 0.65) {
              ritmoKey = "no_ritmo";
              ritmoLabel = "No ritmo";
              ritmoClass = "bg-sky-950/80 text-sky-300 border-sky-700/60";
            } else {
              ritmoKey = "lento";
              ritmoLabel = "Lento";
              ritmoClass = "bg-amber-950/80 text-amber-300 border-amber-700/60";
            }
          }

          return {
            ...item,
            totalOferta,
            custoTotalItem,
            margemPct,
            qtdVendida,
            pctAtingido,
            saldoRestante,
            mediaDia,
            receitaRealizada,
            lucroRealizado,
            margemRealizadaPct,
            ritmoKey,
            ritmoLabel,
            ritmoClass,
          };
        });
      }, [itens, statusCampanha.iniciada, vendasNoPeriodo, diasDecorridos, diasTotais]);

      const kpisLote = useMemo(() => {
        const totalSkus = itens.length;
        const totalUnidadesOfertadas = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0),
          0
        );
        const custoTotalLote = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.custoUnit) || 0),
          0
        );
        const receitaPotencial = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.precoOferta) || 0),
          0
        );
        const lucroBrutoPotencial = receitaPotencial - custoTotalLote;
        const margemMediaPotencial =
          receitaPotencial > 0
            ? Number(((lucroBrutoPotencial / receitaPotencial) * 100).toFixed(1))
            : 0;

        return {
          totalSkus,
          totalUnidadesOfertadas,
          custoTotalLote,
          receitaPotencial,
          lucroBrutoPotencial,
          margemMediaPotencial,
        };
      }, [itens]);

      const kpisSaida = useMemo(() => {
        const unidadesVendidas = linhasPerformance.reduce(
          (acc, l) => acc + l.qtdVendida,
          0
        );
        const pctEsgotamento =
          kpisLote.totalUnidadesOfertadas > 0
            ? Number(
                ((unidadesVendidas / kpisLote.totalUnidadesOfertadas) * 100).toFixed(1)
              )
            : 0;
        const saldoTotalRestante = Math.max(
          0,
          kpisLote.totalUnidadesOfertadas - unidadesVendidas
        );
        const receitaRealizada = linhasPerformance.reduce(
          (acc, l) => acc + l.receitaRealizada,
          0
        );
        const lucroRealizado = linhasPerformance.reduce(
          (acc, l) => acc + l.lucroRealizado,
          0
        );
        const margemRealizada =
          receitaRealizada > 0
            ? Number(((lucroRealizado / receitaRealizada) * 100).toFixed(1))
            : 0;
        const ritmoMedioDia =
          diasDecorridos > 0
            ? Number((unidadesVendidas / diasDecorridos).toFixed(1))
            : 0;

        return {
          unidadesVendidas,
          pctEsgotamento,
          saldoTotalRestante,
          receitaRealizada,
          lucroRealizado,
          margemRealizada,
          ritmoMedioDia,
        };
      }, [linhasPerformance, kpisLote.totalUnidadesOfertadas, diasDecorridos]);

      const serieDiariaSaida = useMemo(() => {
        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        if (!inicio) return [];

        const skusPromocaoSet = new Set(itens.map((i) => i.codigo));
        const mapaDia = new Map();

        for (let i = 0; i < diasDecorridos; i++) {
          const d = new Date(inicio);
          d.setDate(d.getDate() + i);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const key = `${y}-${m}-${day}`;
          mapaDia.set(key, {
            data: key,
            label: `${day}/${m}`,
            unidades: 0,
            receita: 0,
          });
        }

        vendasNoPeriodo.forEach((v) => {
          if (!skusPromocaoSet.has(v.codigo)) return;
          const bucket = mapaDia.get(v.data);
          if (bucket) {
            const qtd = Number(v.qtd) || 0;
            const preco = Number(v.precoPraticado) || 0;
            bucket.unidades += qtd;
            bucket.receita += qtd * preco;
          }
        });

        const lista = Array.from(mapaDia.values());
        const maxUnidades = Math.max(1, ...lista.map((x) => x.unidades));
        return lista.map((x) => ({
          ...x,
          alturaPct: Math.max(8, Math.round((x.unidades / maxUnidades) * 100)),
        }));
      }, [statusCampanha.iniciada, dataInicio, itens, diasDecorridos, vendasNoPeriodo]);

      const gruposDisponiveis = useMemo(() => {
        const set = new Set(itens.map((i) => i.grupo).filter(Boolean));
        return ["TODOS", ...Array.from(set)];
      }, [itens]);

      const itensFiltrados = useMemo(() => {
        return linhasPerformance.filter((item) => {
          if (filtroGrupo !== "TODOS" && item.grupo !== filtroGrupo) return false;
          if (somenteComSaida && item.qtdVendida <= 0) return false;
          return true;
        });
      }, [linhasPerformance, filtroGrupo, somenteComSaida]);

      const codigosCatalogo = useMemo(
        () => Object.keys(catalogoSankhya),
        [catalogoSankhya]
      );

      return (
        <div className="min-h-screen bg-[#070b14] text-slate-100 p-4 md:p-6">
          <div className="max-w-7xl mx-auto space-y-5">
            {/* Barra Superior de Campanhas Salvas + Sincronização Dash Estoque */}
            <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="flex flex-wrap items-center gap-3">

                        type="checkbox"
                        checked={somenteComSaida}
                        onChange={(e) => setSomenteComSaida(e.target.checked)}
                        className="accent-amber-400"
                      />
                      Somente com saída
                    </label>
                  )}

                  <button
                    type="button"
                    onClick={handleLimparLista}
                    className="px-3.5 py-2 rounded-lg text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 border border-rose-800/60 transition cursor-pointer"
                  >
                    Limpar Lista
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      exportarCsvPromocao({
                        nomePromocao,
                        dataInicio,
                        dataFim,
                        linhasPerformance: itensFiltrados,
                        iniciada: statusCampanha.iniciada,
                      })
                    }
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition cursor-pointer"
                  >
                    Exportar Promoção (.csv)
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto rounded-xl border border-slate-800">
                <table className="w-full text-left border-collapse min-w-[980px]">
                  <thead>
                    <tr className="bg-[#080d18] text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                      <th className="py-3 px-3">CÓDIGO</th>
                      <th className="py-3 px-3">DESCRIÇÃO DO PRODUTO</th>
                      <th className="py-3 px-3">GRUPO</th>
                      <th className="py-3 px-3 text-right">DISP. ESTOQUE</th>
                      <th className="py-3 px-3 text-right">CUSTO UNIT. (R$)</th>
                      <th className="py-3 px-3 text-right">QTD OFERTA</th>
                      <th className="py-3 px-3 text-right">MARKUP (%)</th>
                      <th className="py-3 px-3 text-right text-amber-400">
                        PREÇO OFERTA (R$)
                      </th>
                      <th className="py-3 px-3 text-right">MARGEM (%)</th>
                      <th className="py-3 px-3 text-right">TOTAL OFERTA (R$)</th>
                      {statusCampanha.iniciada && (
                        <>
                          <th className="py-3 px-3 text-right text-emerald-400">
                            VENDIDO
                          </th>
                          <th className="py-3 px-3 text-right">SALDO</th>
                          <th className="py-3 px-3 text-right">MÉDIA/DIA</th>
                          <th className="py-3 px-3 text-center">RITMO</th>
                        </>
                      )}
                      <th className="py-3 px-3 text-center">REMOVER</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70 text-sm">
                    {itensFiltrados.length === 0 ? (
                      <tr>
                        <td
                          colSpan={statusCampanha.iniciada ? 15 : 11}
                          className="py-12 px-4 text-center text-slate-400"
                        >
                          Nenhum item inserido na promoção ainda. Digite o código do
                          item no campo acima e aperte{" "}
                          <strong className="text-slate-200">Enter</strong> ou clique
                          em{" "}
                          <strong className="text-sky-400">
                            Sincronizar / Importar Estoque
                          </strong>
                          .
                        </td>
                      </tr>
                    ) : (
                      itensFiltrados.map((item) => (
                        <tr
                          key={item.codigo}
                          className="hover:bg-slate-900/50 transition"
                        >
                          <td className="py-3 px-3 font-mono font-semibold text-amber-400">
                            {item.codigo}
                          </td>
                          <td className="py-3 px-3 font-medium text-slate-100">
                            {item.descricao}
                          </td>
                          <td className="py-3 px-3 text-slate-400 text-xs">
                            {item.grupo}
                          </td>
                          <td className="py-3 px-3 text-right text-slate-300">
                            {formatNumber(
                              item.estoqueDisp,
                              item.estoqueDisp % 1 !== 0 ? 1 : 0
                            )}
                          </td>
                          <td className="py-3 px-3 text-right text-slate-300">
                            {formatBRL(item.custoUnit)}
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              min="0"
                              value={item.qtdOferta}
                              onChange={(e) =>
                                handleAtualizarQtdOferta(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right text-sm text-white outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              step="0.5"
                              value={item.markupPct}
                              onChange={(e) =>
                                handleAtualizarMarkupItem(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right text-sm text-white outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              step="0.01"
                              min="0"
                              value={item.precoOferta}
                              onChange={(e) =>
                                handleAtualizarPrecoOferta(
                                  item.codigo,
                                  e.target.value
                                )
                              }
                              className="w-24 bg-[#080d18] border border-amber-400/70 focus:border-amber-300 rounded px-2 py-1 text-right text-sm font-semibold text-amber-300 outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right font-medium text-emerald-400">
                            {item.margemPct.toFixed(1)}%
                          </td>
                          <td className="py-3 px-3 text-right font-semibold text-white">
                            {formatBRL(item.totalOferta)}
                          </td>

                          {statusCampanha.iniciada && (
                            <>
                              <td className="py-3 px-3 text-right">
                                <span className="font-semibold text-emerald-400">
                                  {formatNumber(item.qtdVendida)}
                                </span>
                                <span className="block text-[11px] text-slate-400">
                                  {item.pctAtingido.toFixed(1)}%
                                </span>
                              </td>
                              <td className="py-3 px-3 text-right text-slate-200 font-medium">
                                {formatNumber(item.saldoRestante)}
                              </td>
                              <td className="py-3 px-3 text-right text-slate-300">
                                {formatNumber(item.mediaDia, 2)}/d
                              </td>
                              <td className="py-3 px-3 text-center">
                                <span
                                  className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${item.ritmoClass}`}
                                >
                                  {item.ritmoLabel}
                                </span>
                              </td>
                            </>
                          )}

                          <td className="py-3 px-3 text-center">
                            <button
                              type="button"
                              onClick={() => handleRemoverItem(item.codigo)}
                              className="text-xs px-2.5 py-1 rounded bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/60 transition cursor-pointer"
                            >
                              Remover
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PromocoesDashboard />);
  </script>
</body>
</html>
