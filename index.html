<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Ofertas — Gestão de Campanhas e Saída</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#070b14] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const STORAGE_KEY = "promocoes_gestao_campanhas_v1";
    const SALES_LOG_KEY = "promocoes_vendas_simulador_v1";

    const CATALOGO_SKUS = {
      "1001": {
        codigo: "1001",

        grupo: "Mercearia",
        estoqueDisp: 240,
        custoUnit: 18.5,
      },
      "1002": {

        descricao: "Azeite Extra Virgem Vidro 500ml",
        grupo: "Mercearia",
        estoqueDisp: 115,
        custoUnit: 29.9,
      },
      "1003": {
        codigo: "1003",
        descricao: "Shampoo Neutro Uso Diário 400ml",
        grupo: "Higiene Pessoal",
        estoqueDisp: 180,
        custoUnit: 12.4,
      },
      "1004": {
        codigo: "1004",
        descricao: "Sabonete Líquido Erva Doce 250ml",
        grupo: "Higiene Pessoal",
        estoqueDisp: 320,
        custoUnit: 8.2,
      },
      "1005": {
        codigo: "1005",

        grupo: "Limpeza",
        estoqueDisp: 450,
        custoUnit: 2.35,
      },
      "1431": {
        codigo: "1431",
        descricao: "Barra de Chocolate Meio Amargo 90g",
        grupo: "Bomboniere",
        estoqueDisp: 190,
        custoUnit: 5.8,
      },
      "2045": {
        codigo: "2045",
        descricao: "Suco Integral de Uva Tinto 1L",
        grupo: "Bebidas",

        custoUnit: 9.6,
      },
      "3090": {
        codigo: "3090",
        descricao: "Granola Tradicional com Castanhas 400g",
        grupo: "Saudáveis",
        estoqueDisp: 95,
        custoUnit: 14.75,
      },
    };

    function toInputDate(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
    }

    function formatDatePtBr(dateStr) {
      const d = parseLocalDate(dateStr);
      if (!d) return "—";
      return d.toLocaleDateString("pt-BR");
    }

    function formatBRL(value) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatNumber(value, decimals = 0) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function calcPrecoFromMarkup(custo, markupPct) {
      const m = Number.isFinite(markupPct) ? markupPct : 0;
      return Math.max(0, Number((custo * (1 + m / 100)).toFixed(2)));
    }

    function calcMarkupFromPreco(custo, preco) {
      if (!custo || custo <= 0) return 0;
      return Number((((preco - custo) / custo) * 100).toFixed(2));
    }

    function calcMargemPct(preco, custo) {
      if (!preco || preco <= 0) return 0;
      return Number((((preco - custo) / preco) * 100).toFixed(1));
    }

    function criarItemPromocao(skuObj, markupInicial = 25, qtdOferta = 10) {
      const custo = Number(skuObj.custoUnit) || 0;
      const precoOferta = calcPrecoFromMarkup(custo, markupInicial);
      return {
        codigo: skuObj.codigo,
        descricao: skuObj.descricao,
        grupo: skuObj.grupo,
        estoqueDisp: Number(skuObj.estoqueDisp) || 0,
        custoUnit: custo,
        qtdOferta: Math.max(1, Number(qtdOferta) || 1),
        markupPct: Number(markupInicial) || 0,
        precoOferta,
      };
    }

    function gerarVendasExemplo() {
      const hoje = new Date();
      hoje.setHours(12, 0, 0, 0);

      const makeSale = (daysAgo, codigo, qtd, precoPraticado) => {
        const dt = new Date(hoje);
        dt.setDate(dt.getDate() - daysAgo);
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const day = String(dt.getDate()).padStart(2, "0");
        return {
          id: `${codigo}-${daysAgo}-${Math.random().toString(36).slice(2, 7)}`,
          data: `${y}-${m}-${day}`,
          codigo,
          qtd,
          precoPraticado,
        };
      };

      return [
        makeSale(5, "1431", 18, 7.25),
        makeSale(4, "1431", 22, 7.25),
        makeSale(3, "1431", 16, 7.25),
        makeSale(2, "1431", 25, 7.25),
        makeSale(1, "1431", 19, 7.25),
        makeSale(0, "1431", 14, 7.25),

        makeSale(5, "1001", 8, 23.13),
        makeSale(4, "1001", 11, 23.13),
        makeSale(2, "1001", 9, 23.13),
        makeSale(1, "1001", 12, 23.13),
        makeSale(0, "1001", 7, 23.13),

        makeSale(5, "2045", 6, 12.0),
        makeSale(3, "2045", 5, 12.0),
        makeSale(1, "2045", 8, 12.0),
        makeSale(0, "2045", 4, 12.0),

        makeSale(4, "1004", 7, 10.25),
        makeSale(2, "1004", 5, 10.25),
      ];
    }

    function criarCampanhasIniciais() {
      const item1431 = criarItemPromocao(CATALOGO_SKUS["1431"], 25, 120);
      item1431.precoOferta = 7.25;
      item1431.markupPct = calcMarkupFromPreco(item1431.custoUnit, 7.25);

      const item1001 = criarItemPromocao(CATALOGO_SKUS["1001"], 25, 80);
      item1001.precoOferta = 23.13;
      item1001.markupPct = calcMarkupFromPreco(item1001.custoUnit, 23.13);

      const item2045 = criarItemPromocao(CATALOGO_SKUS["2045"], 25, 60);
      item2045.precoOferta = 12.0;
      item2045.markupPct = calcMarkupFromPreco(item2045.custoUnit, 12.0);

      const item1004 = criarItemPromocao(CATALOGO_SKUS["1004"], 25, 90);
      item1004.precoOferta = 10.25;
      item1004.markupPct = calcMarkupFromPreco(item1004.custoUnit, 10.25);

      return [
        {
          id: "camp-relampago-ativa",
          nome: "Promoção Relâmpago",
          markupInicial: 25,
          dataInicio: toInputDate(-5),
          dataFim: toInputDate(4),
          atualizadoEm: new Date().toISOString(),
          itens: [item1431, item1001, item2045, item1004],
        },
        {
          id: "camp-semana-saude",
          nome: "Semana Saudável & Café",
          markupInicial: 30,
          dataInicio: toInputDate(3),
          dataFim: toInputDate(10),
          atualizadoEm: new Date().toISOString(),
          itens: [
            criarItemPromocao(CATALOGO_SKUS["3090"], 30, 50),
            criarItemPromocao(CATALOGO_SKUS["1001"], 30, 70),
          ],
        },
      ];
    }

    function getStatusCampanha(dataInicio, dataFim) {
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);

      if (!inicio) {
        return {
          key: "sem_data",
          label: "Sem Data Início",
          badgeClass: "bg-slate-800 text-slate-300 border-slate-700",
          iniciada: false,
        };
      }

      if (hoje < inicio) {
        return {
          key: "agendada",
          label: "Agendada",
          badgeClass: "bg-sky-950/80 text-sky-300 border-sky-700/60",
          iniciada: false,
        };
      }

      if (fim && hoje > fim) {
        return {
          key: "encerrada",
          label: "Encerrada",
          badgeClass: "bg-amber-950/80 text-amber-300 border-amber-700/60",
          iniciada: true,
        };
      }

      return {
        key: "ativa",
        label: "Em Andamento",
        badgeClass: "bg-emerald-950/80 text-emerald-300 border-emerald-600/60",
        iniciada: true,
      };
    }

    function getDiasDecorridos(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      if (!inicio) return 0;

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      if (hoje < inicio) return 0;

      const fim = parseLocalDate(dataFim);
      const limite = fim && hoje > fim ? fim : hoje;
      const diffMs = limite.getTime() - inicio.getTime();
      return Math.max(1, Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1);
    }

    function getDiasTotaisCampanha(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);
      if (!inicio || !fim || fim < inicio) return null;
      const diffMs = fim.getTime() - inicio.getTime();
      return Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
    }

    function exportarCsvPromocao({
      nomePromocao,
      dataInicio,
      dataFim,
      linhasPerformance,
      iniciada,
    }) {
      const headers = [
        "Campanha",
        "Data Inicio",
        "Data Fim",
        "Codigo SKU",
        "Descricao",
        "Grupo",
        "Estoque Disp.",
        "Custo Unit. (R$)",
        "Qtd Oferta",
        "Markup (%)",
        "Preco Oferta (R$)",
        "Margem Oferta (%)",
        "Total Oferta (R$)",
        ...(iniciada
          ? [
              "Qtd Vendida",
              "% Atingido",
              "Saldo Restante",
              "Media Venda/Dia",
              "Receita Realizada (R$)",
              "Ritmo",
            ]
          : []),
      ];

      const escapeCsv = (val) => {
        const str = String(val ?? "");
        if (str.includes(";") || str.includes('"') || str.includes("\n")) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      const rows = linhasPerformance.map((item) => [
        nomePromocao || "Promocao sem nome",
        dataInicio || "",
        dataFim || "",
        item.codigo,
        item.descricao,
        item.grupo,
        item.estoqueDisp,
        item.custoUnit.toFixed(2).replace(".", ","),
        item.qtdOferta,
        item.markupPct.toFixed(2).replace(".", ","),
        item.precoOferta.toFixed(2).replace(".", ","),
        item.margemPct.toFixed(1).replace(".", ","),
        item.totalOferta.toFixed(2).replace(".", ","),
        ...(iniciada
          ? [
              item.qtdVendida,
              item.pctAtingido.toFixed(1).replace(".", ","),
              item.saldoRestante,
              item.mediaDia.toFixed(2).replace(".", ","),
              item.receitaRealizada.toFixed(2).replace(".", ","),
              item.ritmoLabel,
            ]
          : []),
      ]);

      const csvContent =
        "\uFEFF" +
        [headers, ...rows]
          .map((row) => row.map(escapeCsv).join(";"))
          .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const slug = (nomePromocao || "promocao")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      link.href = url;
      link.setAttribute("download", `${slug || "promocao"}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function PromocoesDashboard() {
      const [campanhas, setCampanhas] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch {
          // ignora erro de storage
        }
        return criarCampanhasIniciais();
      });

      const [vendas, setVendas] = useState(() => {
        try {
          const saved = localStorage.getItem(SALES_LOG_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {
          // ignora erro de storage
        }
        return gerarVendasExemplo();
      });

      const [campanhaAtivaId, setCampanhaAtivaId] = useState(
        () => campanhas[0]?.id || null
      );

      const [nomePromocao, setNomePromocao] = useState(
        () => campanhas[0]?.nome || "Promoção Relâmpago"
      );
      const [markupInicial, setMarkupInicial] = useState(
        () => campanhas[0]?.markupInicial ?? 25
      );
      const [dataInicio, setDataInicio] = useState(
        () => campanhas[0]?.dataInicio || toInputDate(-5)
      );
      const [dataFim, setDataFim] = useState(
        () => campanhas[0]?.dataFim || toInputDate(4)
      );
      const [itens, setItens] = useState(() => campanhas[0]?.itens || []);

      const [skuInput, setSkuInput] = useState("");
      const [feedback, setFeedback] = useState(null);
      const [filtroGrupo, setFiltroGrupo] = useState("TODOS");
      const [somenteComSaida, setSomenteComSaida] = useState(false);

      const [simSku, setSimSku] = useState("1431");
      const [simQtd, setSimQtd] = useState(5);
      const [simData, setSimData] = useState(() => toInputDate(0));

      const skuInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(campanhas));
        } catch {
          // ignora erro de storage
        }
      }, [campanhas]);

      useEffect(() => {
        try {
          localStorage.setItem(SALES_LOG_KEY, JSON.stringify(vendas));
        } catch {
          // ignora erro de storage
        }
      }, [vendas]);

      const showNotice = (type, text) => {
        setFeedback({ type, text });
      };

      const carregarCampanhaNoEditor = (camp) => {
        if (!camp) return;
        setCampanhaAtivaId(camp.id);
        setNomePromocao(camp.nome || "");
        setMarkupInicial(camp.markupInicial ?? 25);
        setDataInicio(camp.dataInicio || "");
        setDataFim(camp.dataFim || "");
        setItens(Array.isArray(camp.itens) ? camp.itens : []);
        setFeedback(null);
      };

      const handleNovaPromocao = () => {
        setCampanhaAtivaId(null);
        setNomePromocao("");
        setMarkupInicial(25);
        setDataInicio(toInputDate(0));
        setDataFim(toInputDate(7));
        setItens([]);
        setFiltroGrupo("TODOS");
        setSomenteComSaida(false);
        showNotice(
          "info",
          "Nova promoção iniciada. Preencha o nome, datas, adicione SKUs e clique em Salvar Promoção."
        );
        skuInputRef.current?.focus();
      };

      const handleSalvarPromocao = () => {
        const nomeLimpo = nomePromocao.trim();
        if (!nomeLimpo) {
          showNotice("error", "Informe o Nome da Promoção / Campanha antes de salvar.");
          return;
        }
        if (!dataInicio) {
          showNotice("error", "Defina a Data de Início da promoção.");
          return;
        }
        if (dataFim && dataFim < dataInicio) {
          showNotice(
            "error",
            "A Data de Fim não pode ser anterior à Data de Início."
          );
          return;
        }
        if (itens.length === 0) {
          showNotice(
            "error",
            "Adicione pelo menos 1 item (SKU) antes de salvar a promoção."
          );
          return;
        }

        const idAlvo =
          campanhaAtivaId ||
          `camp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

        const novaCampanha = {
          id: idAlvo,
          nome: nomeLimpo,
          markupInicial: Number(markupInicial) || 0,
          dataInicio,
          dataFim,
          atualizadoEm: new Date().toISOString(),
          itens,
        };

        setCampanhas((prev) => {
          const exists = prev.some((c) => c.id === idAlvo);
          if (exists) {
            return prev.map((c) => (c.id === idAlvo ? novaCampanha : c));
          }
          return [novaCampanha, ...prev];
        });
        setCampanhaAtivaId(idAlvo);
        showNotice(
          "success",
          `Promoção "${nomeLimpo}" salva com sucesso (${itens.length} SKU${
            itens.length > 1 ? "s" : ""
          }).`
        );
      };

      const handleExcluirCampanha = () => {
        if (!campanhaAtivaId) return;
        const alvo = campanhas.find((c) => c.id === campanhaAtivaId);
        const restantes = campanhas.filter((c) => c.id !== campanhaAtivaId);
        setCampanhas(restantes);

        if (restantes.length > 0) {
          carregarCampanhaNoEditor(restantes[0]);
        } else {
          setCampanhaAtivaId(null);
          setNomePromocao("");
          setItens([]);
        }
        showNotice(
          "info",
          `Campanha "${alvo?.nome || "selecionada"}" removida.`
        );
      };

      const handleInserirSku = (e) => {
        if (e) e.preventDefault();
        const codigoLimpo = skuInput.trim();
        if (!codigoLimpo) return;

        const skuCatalogo = CATALOGO_SKUS[codigoLimpo];
        if (!skuCatalogo) {
          showNotice(
            "error",
            `SKU "${codigoLimpo}" não encontrado no catálogo. Tente: 1001, 1002, 1003, 1004, 1005, 1431, 2045 ou 3090.`
          );
          return;
        }

        const existente = itens.find((i) => i.codigo === skuCatalogo.codigo);
        if (existente) {
          setItens((prev) =>
            prev.map((item) =>
              item.codigo === skuCatalogo.codigo
                ? { ...item, qtdOferta: item.qtdOferta + 1 }
                : item
            )
          );
          showNotice(
            "success",
            `SKU ${skuCatalogo.codigo} já estava na lista: quantidade ofertada incrementada para ${
              existente.qtdOferta + 1
            }.`
          );
        } else {
          const novoItem = criarItemPromocao(
            skuCatalogo,
            Number(markupInicial) || 0,
            10
          );
          setItens((prev) => [...prev, novoItem]);
          showNotice(
            "success",
            `SKU ${skuCatalogo.codigo} (${skuCatalogo.descricao}) adicionado à promoção.`
          );
        }

        setSkuInput("");
        skuInputRef.current?.focus();
      };

      const handleAplicarMarkupEmTodos = () => {
        const m = Number(markupInicial) || 0;
        setItens((prev) =>
          prev.map((item) => ({
            ...item,
            markupPct: m,
            precoOferta: calcPrecoFromMarkup(item.custoUnit, m),
          }))
        );
        showNotice(
          "info",
          `Markup de ${m}% reaplicado em todos os ${itens.length} itens da lista.`
        );
      };

      const handleAtualizarQtdOferta = (codigo, novaQtd) => {
        const qtd = Math.max(0, Number(novaQtd) || 0);
        setItens((prev) =>
          prev.map((item) => (item.codigo === codigo ? { ...item, qtdOferta: qtd } : item))
        );
      };

      const handleAtualizarMarkupItem = (codigo, novoMarkup) => {
        const m = Number(novoMarkup);
        const markupVal = Number.isFinite(m) ? m : 0;
        setItens((prev) =>
          prev.map((item) =>
            item.codigo === codigo
              ? {
                  ...item,
                  markupPct: markupVal,
                  precoOferta: calcPrecoFromMarkup(item.custoUnit, markupVal),
                }
              : item
          )
        );
      };

      const handleAtualizarPrecoOferta = (codigo, novoPreco) => {
        const p = Number(novoPreco);
        const precoVal = Number.isFinite(p) ? Math.max(0, p) : 0;
        setItens((prev) =>
          prev.map((item) =>
            item.codigo === codigo
              ? {
                  ...item,
                  precoOferta: precoVal,
                  markupPct: calcMarkupFromPreco(item.custoUnit, precoVal),
                }
              : item
          )
        );
      };

      const handleRemoverItem = (codigo) => {
        setItens((prev) => prev.filter((item) => item.codigo !== codigo));
      };

      const handleLimparLista = () => {
        setItens([]);
        showNotice("info", "Lista de itens da promoção limpa.");
      };

      const handleRegistrarVendaSimulada = (e) => {
        e.preventDefault();
        const qtd = Math.max(1, Number(simQtd) || 1);
        const skuCatalogo = CATALOGO_SKUS[simSku];
        if (!skuCatalogo || !simData) return;

        const itemEmPromocao = itens.find((i) => i.codigo === simSku);
        const precoPraticado = itemEmPromocao
          ? itemEmPromocao.precoOferta
          : calcPrecoFromMarkup(skuCatalogo.custoUnit, 25);

        const novaVenda = {
          id: `sale-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          data: simData,
          codigo: simSku,
          qtd,
          precoPraticado,
        };

        setVendas((prev) => [novaVenda, ...prev]);
        showNotice(
          "success",
          `Venda registrada: ${qtd} un. do SKU ${simSku} em ${formatDatePtBr(
            simData
          )} a ${formatBRL(precoPraticado)}.`
        );
      };

      const statusCampanha = useMemo(
        () => getStatusCampanha(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const diasDecorridos = useMemo(
        () => getDiasDecorridos(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const diasTotais = useMemo(
        () => getDiasTotaisCampanha(dataInicio, dataFim),
        [dataInicio, dataFim]
      );

      const vendasNoPeriodo = useMemo(() => {
        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        const fim = parseLocalDate(dataFim);
        const hoje = new Date();
        hoje.setHours(23, 59, 59, 999);
        const limiteSuperior = fim
          ? new Date(fim.getFullYear(), fim.getMonth(), fim.getDate(), 23, 59, 59, 999)
          : hoje;

        return vendas.filter((v) => {
          const dt = parseLocalDate(v.data);
          if (!dt || !inicio) return false;
          return dt >= inicio && dt <= limiteSuperior;
        });
      }, [vendas, statusCampanha.iniciada, dataInicio, dataFim]);

      const linhasPerformance = useMemo(() => {
        return itens.map((item) => {
          const totalOferta = item.qtdOferta * item.precoOferta;
          const custoTotalItem = item.qtdOferta * item.custoUnit;
          const margemPct = calcMargemPct(item.precoOferta, item.custoUnit);

          const vendasSku = statusCampanha.iniciada
            ? vendasNoPeriodo.filter((v) => v.codigo === item.codigo)
            : [];

          const qtdVendida = vendasSku.reduce(
            (acc, v) => acc + (Number(v.qtd) || 0),
            0
          );
          const receitaRealizada = vendasSku.reduce(
            (acc, v) => acc + (Number(v.qtd) || 0) * (Number(v.precoPraticado) || item.precoOferta),
            0
          );
          const custoRealizado = qtdVendida * item.custoUnit;
          const lucroRealizado = receitaRealizada - custoRealizado;
          const margemRealizadaPct =
            receitaRealizada > 0
              ? Number((((receitaRealizada - custoRealizado) / receitaRealizada) * 100).toFixed(1))
              : 0;

          const pctAtingido =
            item.qtdOferta > 0
              ? Number(((qtdVendida / item.qtdOferta) * 100).toFixed(1))
              : 0;
          const saldoRestante = Math.max(0, item.qtdOferta - qtdVendida);
          const mediaDia =
            diasDecorridos > 0 ? Number((qtdVendida / diasDecorridos).toFixed(2)) : 0;

          const ritmoEsperadoDia =
            diasTotais && diasTotais > 0 && item.qtdOferta > 0
              ? item.qtdOferta / diasTotais
              : 0.5;

          let ritmoKey = "sem_saida";
          let ritmoLabel = "Sem saída";
          let ritmoClass = "bg-slate-800 text-slate-400 border-slate-700";

          if (qtdVendida > 0) {
            if (mediaDia >= ritmoEsperadoDia * 1.15) {
              ritmoKey = "acelerado";
              ritmoLabel = "Acelerado";
              ritmoClass = "bg-emerald-950/80 text-emerald-300 border-emerald-700/60";
            } else if (mediaDia >= ritmoEsperadoDia * 0.65) {
              ritmoKey = "no_ritmo";
              ritmoLabel = "No ritmo";
              ritmoClass = "bg-sky-950/80 text-sky-300 border-sky-700/60";
            } else {
              ritmoKey = "lento";
              ritmoLabel = "Lento";
              ritmoClass = "bg-amber-950/80 text-amber-300 border-amber-700/60";
            }
          }

          return {
            ...item,
            totalOferta,
            custoTotalItem,
            margemPct,
            qtdVendida,
            pctAtingido,
            saldoRestante,
            mediaDia,
            receitaRealizada,
            lucroRealizado,
            margemRealizadaPct,
            ritmoKey,
            ritmoLabel,
            ritmoClass,
          };
        });
      }, [itens, statusCampanha.iniciada, vendasNoPeriodo, diasDecorridos, diasTotais]);

      const kpisLote = useMemo(() => {
        const totalSkus = itens.length;
        const totalUnidadesOfertadas = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0),
          0
        );
        const custoTotalLote = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.custoUnit) || 0),
          0
        );
        const receitaPotencial = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.precoOferta) || 0),
          0
        );
        const lucroBrutoPotencial = receitaPotencial - custoTotalLote;
        const margemMediaPotencial =
          receitaPotencial > 0
            ? Number(((lucroBrutoPotencial / receitaPotencial) * 100).toFixed(1))
            : 0;

        return {
          totalSkus,
          totalUnidadesOfertadas,
          custoTotalLote,
          receitaPotencial,
          lucroBrutoPotencial,
          margemMediaPotencial,
        };
      }, [itens]);

      const kpisSaida = useMemo(() => {
        const unidadesVendidas = linhasPerformance.reduce(
          (acc, l) => acc + l.qtdVendida,
          0
        );
        const pctEsgotamento =
          kpisLote.totalUnidadesOfertadas > 0
            ? Number(
                ((unidadesVendidas / kpisLote.totalUnidadesOfertadas) * 100).toFixed(1)
              )
            : 0;
        const saldoTotalRestante = Math.max(
          0,
          kpisLote.totalUnidadesOfertadas - unidadesVendidas
        );
        const receitaRealizada = linhasPerformance.reduce(
          (acc, l) => acc + l.receitaRealizada,
          0
        );
        const lucroRealizado = linhasPerformance.reduce(
          (acc, l) => acc + l.lucroRealizado,
          0
        );
        const margemRealizada =
          receitaRealizada > 0
            ? Number(((lucroRealizado / receitaRealizada) * 100).toFixed(1))
            : 0;
        const ritmoMedioDia =
          diasDecorridos > 0
            ? Number((unidadesVendidas / diasDecorridos).toFixed(1))
            : 0;

        return {
          unidadesVendidas,
          pctEsgotamento,
          saldoTotalRestante,
          receitaRealizada,
          lucroRealizado,
          margemRealizada,
          ritmoMedioDia,
        };
      }, [linhasPerformance, kpisLote.totalUnidadesOfertadas, diasDecorridos]);

      const serieDiariaSaida = useMemo(() => {
        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        if (!inicio) return [];

        const skusPromocaoSet = new Set(itens.map((i) => i.codigo));
        const mapaDia = new Map();

        for (let i = 0; i < diasDecorridos; i++) {
          const d = new Date(inicio);
          d.setDate(d.getDate() + i);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const key = `${y}-${m}-${day}`;
          mapaDia.set(key, {
            data: key,
            label: `${day}/${m}`,
            unidades: 0,
            receita: 0,
          });
        }

        vendasNoPeriodo.forEach((v) => {
          if (!skusPromocaoSet.has(v.codigo)) return;
          const bucket = mapaDia.get(v.data);
          if (bucket) {
            const qtd = Number(v.qtd) || 0;
            const preco = Number(v.precoPraticado) || 0;
            bucket.unidades += qtd;
            bucket.receita += qtd * preco;
          }
        });

        const lista = Array.from(mapaDia.values());
        const maxUnidades = Math.max(1, ...lista.map((x) => x.unidades));
        return lista.map((x) => ({
          ...x,
          alturaPct: Math.max(8, Math.round((x.unidades / maxUnidades) * 100)),
        }));
      }, [statusCampanha.iniciada, dataInicio, itens, diasDecorridos, vendasNoPeriodo]);

      const gruposDisponiveis = useMemo(() => {
        const set = new Set(itens.map((i) => i.grupo).filter(Boolean));
        return ["TODOS", ...Array.from(set)];
      }, [itens]);

      const itensFiltrados = useMemo(() => {
        return linhasPerformance.filter((item) => {
          if (filtroGrupo !== "TODOS" && item.grupo !== filtroGrupo) return false;
          if (somenteComSaida && item.qtdVendida <= 0) return false;
          return true;
        });
      }, [linhasPerformance, filtroGrupo, somenteComSaida]);

      return (
        <div className="min-h-screen bg-[#070b14] text-slate-100 p-4 md:p-6">
          <div className="max-w-7xl mx-auto space-y-5">
            {/* Barra Superior de Campanhas Salvas */}
            <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="flex flex-wrap items-center gap-3">
                <div>
                  <span className="text-xs uppercase tracking-wider text-slate-400 block">
                    Campanhas Salvas
                  </span>
                  <div className="flex flex-wrap items-center gap-2 mt-1">
                    <select
                      value={campanhaAtivaId || ""}
                      onChange={(e) => {
                        const found = campanhas.find((c) => c.id === e.target.value);
                        if (found) carregarCampanhaNoEditor(found);
                      }}
                      className="bg-[#080d18] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-400"
                    >
                      {campanhas.length === 0 && (
                        <option value="">Nenhuma promoção salva</option>
                      )}
                      {campanhas.map((c) => {
                        const st = getStatusCampanha(c.dataInicio, c.dataFim);
                        return (
                          <option key={c.id} value={c.id}>
                            {c.nome} ({st.label} • {c.itens?.length || 0} SKUs)
                          </option>
                        );
                      })}
                    </select>

                    <span
                      className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${statusCampanha.badgeClass}`}
                    >
                      {statusCampanha.label}
                    </span>

                    {dataInicio && (
                      <span className="text-xs text-slate-400">
                        Vigência:{" "}
                        <strong className="text-slate-200">
                          {formatDatePtBr(dataInicio)}
                        </strong>{" "}
                        até{" "}
                        <strong className="text-slate-200">
                          {dataFim ? formatDatePtBr(dataFim) : "Em aberto"}
                        </strong>
                      </span>
                    )}
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={handleNovaPromocao}
                  className="px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer"
                >
                  + Nova Promoção
                </button>

                <button
                  type="button"
                  onClick={handleSalvarPromocao}
                  className="px-4 py-2 rounded-lg text-sm font-semibold bg-amber-400 hover:bg-amber-300 text-slate-950 transition cursor-pointer"
                >
                  Salvar Promoção
                </button>

                {campanhaAtivaId && (
                  <button
                    type="button"
                    onClick={handleExcluirCampanha}
                    className="px-3 py-2 rounded-lg text-sm font-medium bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 border border-rose-800/60 transition cursor-pointer"
                  >
                    Excluir
                  </button>
                )}
              </div>
            </div>

            {/* Feedback / Alertas */}
            {feedback && (
              <div
                className={`rounded-xl px-4 py-3 text-sm border flex items-center justify-between ${
                  feedback.type === "error"
                    ? "bg-rose-950/60 border-rose-700/70 text-rose-200"
                    : feedback.type === "success"
                    ? "bg-emerald-950/60 border-emerald-700/70 text-emerald-200"
                    : "bg-sky-950/50 border-sky-700/60 text-sky-200"
                }`}
              >
                <span>{feedback.text}</span>
                <button
                  type="button"
                  onClick={() => setFeedback(null)}
                  className="text-xs opacity-75 hover:opacity-100 ml-4 cursor-pointer"
                >
                  Fechar
                </button>
              </div>
            )}

            {/* Bloco Principal de Montagem Rápida + Datas */}
            <form
              onSubmit={handleInserirSku}
              className="bg-[#0e1525] border-2 border-amber-400/90 rounded-2xl p-5 shadow-lg"
            >
              <div className="flex flex-col xl:flex-row xl:items-end justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="inline-block w-1.5 h-5 rounded bg-amber-400" />
                    <h1 className="text-lg md:text-xl font-bold text-white">
                      Montagem Rápida de Promoção por Código
                    </h1>
                  </div>
                  <p className="text-sm text-slate-400 mt-1">
                    Defina nome, vigência e digite o{" "}
                    <strong className="text-slate-200">Código do SKU</strong> e
                    pressione <strong className="text-slate-200">Enter</strong> para
                    adicionar à tabela de oferta.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 xl:min-w-[780px]">
                  <div className="lg:col-span-2">
                    <label className="block text-xs text-slate-300 mb-1">
                      Nome da Promoção / Campanha
                    </label>
                    <input
                      type="text"
                      value={nomePromocao}
                      onChange={(e) => setNomePromocao(e.target.value)}
                      placeholder="Ex: Promoção Relâmpago"
                      className="w-full bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">
                      Data de Início
                    </label>
                    <input
                      type="date"
                      value={dataInicio}
                      onChange={(e) => setDataInicio(e.target.value)}
                      className="w-full bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">
                      Data de Fim
                    </label>
                    <input
                      type="date"
                      value={dataFim}
                      onChange={(e) => setDataFim(e.target.value)}
                      className="w-full bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs text-slate-300">
                        Markup Inicial (%)
                      </label>
                      {itens.length > 0 && (
                        <button
                          type="button"
                          onClick={handleAplicarMarkupEmTodos}
                          className="text-[11px] text-amber-400 hover:underline cursor-pointer"
                        >
                          Aplicar todos
                        </button>
                      )}
                    </div>
                    <input
                      type="number"
                      step="0.5"
                      value={markupInicial}
                      onChange={(e) => setMarkupInicial(e.target.value)}
                      className="w-full bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>
                </div>
              </div>

              <div className="mt-4 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-stretch sm:items-end justify-between gap-3">
                <div className="text-xs text-slate-400">
                  SKUs disponíveis para teste rápido:{" "}
                  <span className="text-slate-300 font-mono">
                    1001, 1002, 1003, 1004, 1005, 1431, 2045, 3090
                  </span>
                </div>

                <div className="flex items-end gap-2">
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">
                      Código do Item (SKU)
                    </label>
                    <input
                      ref={skuInputRef}
                      type="text"
                      value={skuInput}
                      onChange={(e) => setSkuInput(e.target.value)}
                      placeholder="Ex: 1431"
                      className="w-44 sm:w-52 bg-[#080d18] border-2 border-amber-400/80 focus:border-amber-300 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>
                  <button
                    type="submit"
                    className="px-4 py-2.5 rounded-lg text-sm font-bold bg-amber-400 hover:bg-amber-300 text-slate-950 transition cursor-pointer"
                  >
                    + Inserir
                  </button>
                </div>
              </div>
            </form>

            {/* 4 Cards KPIs do Lote (Layout Base) */}
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
              <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4">
                <span className="text-xs uppercase tracking-wider text-slate-400">
                  ITENS NA PROMOÇÃO
                </span>
                <div className="mt-2 flex items-baseline justify-between gap-2">
                  <strong className="text-2xl font-bold text-white">
                    {kpisLote.totalSkus} SKUs
                  </strong>
                  <span className="text-sm font-semibold text-amber-400">
                    {formatNumber(kpisLote.totalUnidadesOfertadas)} un. ofertadas
                  </span>
                </div>
              </div>

              <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4">
                <span className="text-xs uppercase tracking-wider text-slate-400">
                  CUSTO TOTAL DO LOTE
                </span>
                <div className="mt-2 flex items-baseline justify-between gap-2">
                  <strong className="text-2xl font-bold text-sky-400">
                    {formatBRL(kpisLote.custoTotalLote)}
                  </strong>
                  <span className="text-xs text-slate-400">CMV estimado</span>
                </div>
              </div>

              <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4">
                <span className="text-xs uppercase tracking-wider text-slate-400">
                  RECEITA POTENCIAL OFERTA
                </span>
                <div className="mt-2 flex items-baseline justify-between gap-2">
                  <strong className="text-2xl font-bold text-emerald-400">
                    {formatBRL(kpisLote.receitaPotencial)}
                  </strong>
                  <span className="text-xs font-medium px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60">
                    Faturamento
                  </span>
                </div>
              </div>

              <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-4">
                <span className="text-xs uppercase tracking-wider text-slate-400">
                  LUCRO BRUTO & MARGEM MÉDIA
                </span>
                <div className="mt-2 flex items-baseline justify-between gap-2">
                  <strong className="text-2xl font-bold text-amber-400">
                    {formatBRL(kpisLote.lucroBrutoPotencial)}
                  </strong>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded bg-amber-950/70 text-amber-300 border border-amber-800/60">
                    {kpisLote.margemMediaPotencial.toFixed(1)}% margem
                  </span>
                </div>
              </div>
            </div>

            {/* Bloco de Comportamento de Saída a Partir da Data de Início */}
            <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-5 space-y-4">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                <div>
                  <h2 className="text-base md:text-lg font-bold text-white">
                    Comportamento de Saída a Partir da Data de Início
                  </h2>
                  <p className="text-xs md:text-sm text-slate-400">
                    {statusCampanha.iniciada
                      ? `Apurando vendas no período de ${formatDatePtBr(
                          dataInicio
                        )} (${diasDecorridos}º dia${
                          diasDecorridos > 1 ? "s" : ""
                        } de apuração${
                          diasTotais ? ` de ${diasTotais} dias` : ""
                        }).`
                      : dataInicio
                      ? `A promoção inicia em ${formatDatePtBr(
                          dataInicio
                        )}. A apuração de saída será ativada automaticamente na data de início.`
                      : "Defina uma Data de Início para acompanhar o comportamento de saída dos itens."}
                  </p>
                </div>

                {statusCampanha.iniciada && (
                  <span className="text-xs font-medium px-3 py-1 rounded-full bg-slate-900 border border-slate-700 text-slate-300 self-start md:self-auto">
                    Ritmo médio: {formatNumber(kpisSaida.ritmoMedioDia, 1)} un./dia
                  </span>
                )}
              </div>

              {statusCampanha.iniciada ? (
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                    <div className="bg-[#080d18] border border-slate-800 rounded-xl p-4">
                      <span className="text-xs text-slate-400 uppercase">
                        Unidades Vendidas
                      </span>
                      <div className="mt-1.5 flex items-baseline justify-between">
                        <strong className="text-xl font-bold text-white">
                          {formatNumber(kpisSaida.unidadesVendidas)} /{" "}
                          {formatNumber(kpisLote.totalUnidadesOfertadas)} un.
                        </strong>
                        <span className="text-xs font-semibold text-emerald-400">
                          {kpisSaida.pctEsgotamento.toFixed(1)}% do lote
                        </span>
                      </div>
                      <div className="w-full h-2 bg-slate-800 rounded-full mt-2.5 overflow-hidden">
                        <div
                          className="h-full bg-emerald-400 rounded-full transition-all"
                          style={{
                            width: `${Math.min(100, kpisSaida.pctEsgotamento)}%`,
                          }}
                        />
                      </div>
                    </div>

                    <div className="bg-[#080d18] border border-slate-800 rounded-xl p-4">
                      <span className="text-xs text-slate-400 uppercase">
                        Receita Realizada
                      </span>
                      <div className="mt-1.5 flex items-baseline justify-between">
                        <strong className="text-xl font-bold text-emerald-400">
                          {formatBRL(kpisSaida.receitaRealizada)}
                        </strong>
                        <span className="text-xs text-slate-400">
                          de {formatBRL(kpisLote.receitaPotencial)}
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-2">
                        Saldo restante do lote:{" "}
                        <strong className="text-slate-200">
                          {formatNumber(kpisSaida.saldoTotalRestante)} un.
                        </strong>
                      </p>
                    </div>

                    <div className="bg-[#080d18] border border-slate-800 rounded-xl p-4">
                      <span className="text-xs text-slate-400 uppercase">
                        Lucro & Margem Realizada
                      </span>
                      <div className="mt-1.5 flex items-baseline justify-between">
                        <strong className="text-xl font-bold text-amber-400">
                          {formatBRL(kpisSaida.lucroRealizado)}
                        </strong>
                        <span className="text-xs font-semibold text-amber-300">
                          {kpisSaida.margemRealizada.toFixed(1)}% margem
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-2">
                        Calculado sobre vendas do período
                      </p>
                    </div>

                    <div className="bg-[#080d18] border border-slate-800 rounded-xl p-4">
                      <span className="text-xs text-slate-400 uppercase">
                        Evolução Diária (Un.)
                      </span>
                      <div className="mt-2 h-16 flex items-end gap-1.5">
                        {serieDiariaSaida.map((dia) => (
                          <div
                            key={dia.data}
                            className="flex-1 flex flex-col items-center justify-end h-full group"
                            title={`${dia.label}: ${dia.unidades} un. (${formatBRL(
                              dia.receita
                            )})`}
                          >
                            <span className="text-[10px] text-slate-400 mb-0.5">
                              {dia.unidades}
                            </span>
                            <div
                              className="w-full rounded-t bg-amber-400/85 group-hover:bg-amber-300 transition-all"
                              style={{ height: `${dia.alturaPct}%` }}
                            />
                            <span className="text-[10px] text-slate-500 mt-1">
                              {dia.label}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Simulador Rápido de Venda para Testar Saída */}
                  <form
                    onSubmit={handleRegistrarVendaSimulada}
                    className="bg-[#080d18] border border-slate-800/90 rounded-xl p-3.5 flex flex-col lg:flex-row lg:items-end justify-between gap-3"
                  >
                    <div className="text-xs text-slate-400">
                      <strong className="text-slate-200 block text-sm">
                        Simulador de Saída / Venda
                      </strong>
                      Registre vendas em datas a partir do início da promoção para
                      ver o comportamento atualizar em tempo real.
                    </div>

                    <div className="flex flex-wrap items-end gap-2.5">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          SKU
                        </label>
                        <select
                          value={simSku}
                          onChange={(e) => setSimSku(e.target.value)}
                          className="bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        >
                          {Object.values(CATALOGO_SKUS).map((s) => (
                            <option key={s.codigo} value={s.codigo}>
                              {s.codigo} — {s.descricao}
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          Qtd Vendida
                        </label>
                        <input
                          type="number"
                          min="1"
                          value={simQtd}
                          onChange={(e) => setSimQtd(e.target.value)}
                          className="w-24 bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          Data da Venda
                        </label>
                        <input
                          type="date"
                          value={simData}
                          onChange={(e) => setSimData(e.target.value)}
                          className="bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        />
                      </div>

                      <button
                        type="submit"
                        className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition cursor-pointer"
                      >
                        + Registrar Venda
                      </button>
                    </div>
                  </form>
                </>
              ) : (
                <div className="bg-[#080d18] border border-dashed border-slate-700 rounded-xl p-5 text-center text-sm text-slate-400">
                  {dataInicio
                    ? `Campanha agendada para iniciar em ${formatDatePtBr(
                        dataInicio
                      )}. Assim que a data de início chegar (ou se você ajustar a Data de Início para hoje/passado), o painel de saída e giro por item será exibido aqui.`
                    : "Preencha a Data de Início na montagem da promoção para habilitar o acompanhamento de saída."}
                </div>
              )}
            </div>

            {/* Lista de Itens da Promoção */}
            <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-5">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4">
                <div>
                  <h2 className="text-lg font-bold text-white">
                    Lista de Itens da Promoção
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400">
                    Edite a <strong className="text-slate-200">Qtd Ofertada</strong>,
                    o <strong className="text-slate-200">Markup (%)</strong> ou
                    digite diretamente o{" "}
                    <strong className="text-amber-400">Preço de Oferta (R$)</strong>.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  <select
                    value={filtroGrupo}
                    onChange={(e) => setFiltroGrupo(e.target.value)}
                    className="bg-[#080d18] border border-slate-700 rounded-lg px-3 py-2 text-xs font-medium text-slate-200"
                  >
                    {gruposDisponiveis.map((g) => (
                      <option key={g} value={g}>
                        {g === "TODOS" ? "Todos os Grupos" : g}
                      </option>
                    ))}
                  </select>

                  {statusCampanha.iniciada && (
                    <label className="flex items-center gap-2 text-xs text-slate-300 bg-[#080d18] border border-slate-700 rounded-lg px-3 py-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={somenteComSaida}
                        onChange={(e) => setSomenteComSaida(e.target.checked)}
                        className="accent-amber-400"
                      />
                      Somente com saída
                    </label>
                  )}

                  <button
                    type="button"
                    onClick={handleLimparLista}
                    className="px-3.5 py-2 rounded-lg text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 border border-rose-800/60 transition cursor-pointer"
                  >
                    Limpar Lista
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      exportarCsvPromocao({
                        nomePromocao,
                        dataInicio,
                        dataFim,
                        linhasPerformance: itensFiltrados,
                        iniciada: statusCampanha.iniciada,
                      })
                    }
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition cursor-pointer"
                  >
                    Exportar Promoção (.csv)
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto rounded-xl border border-slate-800">
                <table className="w-full text-left border-collapse min-w-[980px]">
                  <thead>
                    <tr className="bg-[#080d18] text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                      <th className="py-3 px-3">CÓDIGO</th>
                      <th className="py-3 px-3">DESCRIÇÃO DO PRODUTO</th>
                      <th className="py-3 px-3">GRUPO</th>
                      <th className="py-3 px-3 text-right">DISP. ESTOQUE</th>
                      <th className="py-3 px-3 text-right">CUSTO UNIT. (R$)</th>
                      <th className="py-3 px-3 text-right">QTD OFERTA</th>
                      <th className="py-3 px-3 text-right">MARKUP (%)</th>
                      <th className="py-3 px-3 text-right text-amber-400">
                        PREÇO OFERTA (R$)
                      </th>
                      <th className="py-3 px-3 text-right">MARGEM (%)</th>
                      <th className="py-3 px-3 text-right">TOTAL OFERTA (R$)</th>
                      {statusCampanha.iniciada && (
                        <>
                          <th className="py-3 px-3 text-right text-emerald-400">
                            VENDIDO
                          </th>
                          <th className="py-3 px-3 text-right">SALDO</th>
                          <th className="py-3 px-3 text-right">MÉDIA/DIA</th>
                          <th className="py-3 px-3 text-center">RITMO</th>
                        </>
                      )}
                      <th className="py-3 px-3 text-center">REMOVER</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70 text-sm">
                    {itensFiltrados.length === 0 ? (
                      <tr>
                        <td
                          colSpan={statusCampanha.iniciada ? 15 : 11}
                          className="py-12 px-4 text-center text-slate-400"
                        >
                          Nenhum item inserido na promoção ainda. Digite o código do
                          item no campo acima e aperte{" "}
                          <strong className="text-slate-200">Enter</strong>.
                        </td>
                      </tr>
                    ) : (
                      itensFiltrados.map((item) => (
                        <tr
                          key={item.codigo}
                          className="hover:bg-slate-900/50 transition"
                        >
                          <td className="py-3 px-3 font-mono font-semibold text-amber-400">
                            {item.codigo}
                          </td>
                          <td className="py-3 px-3 font-medium text-slate-100">
                            {item.descricao}
                          </td>
                          <td className="py-3 px-3 text-slate-400 text-xs">
                            {item.grupo}
                          </td>
                          <td className="py-3 px-3 text-right text-slate-300">
                            {formatNumber(item.estoqueDisp)}
                          </td>
                          <td className="py-3 px-3 text-right text-slate-300">
                            {formatBRL(item.custoUnit)}
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              min="0"
                              value={item.qtdOferta}
                              onChange={(e) =>
                                handleAtualizarQtdOferta(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right text-sm text-white outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              step="0.5"
                              value={item.markupPct}
                              onChange={(e) =>
                                handleAtualizarMarkupItem(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right text-sm text-white outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right">
                            <input
                              type="number"
                              step="0.01"
                              min="0"
                              value={item.precoOferta}
                              onChange={(e) =>
                                handleAtualizarPrecoOferta(
                                  item.codigo,
                                  e.target.value
                                )
                              }
                              className="w-24 bg-[#080d18] border border-amber-400/70 focus:border-amber-300 rounded px-2 py-1 text-right text-sm font-semibold text-amber-300 outline-none"
                            />
                          </td>
                          <td className="py-3 px-3 text-right font-medium text-emerald-400">
                            {item.margemPct.toFixed(1)}%
                          </td>
                          <td className="py-3 px-3 text-right font-semibold text-white">
                            {formatBRL(item.totalOferta)}
                          </td>

                          {statusCampanha.iniciada && (
                            <>
                              <td className="py-3 px-3 text-right">
                                <span className="font-semibold text-emerald-400">
                                  {formatNumber(item.qtdVendida)}
                                </span>
                                <span className="block text-[11px] text-slate-400">
                                  {item.pctAtingido.toFixed(1)}%
                                </span>
                              </td>
                              <td className="py-3 px-3 text-right text-slate-200 font-medium">
                                {formatNumber(item.saldoRestante)}
                              </td>
                              <td className="py-3 px-3 text-right text-slate-300">
                                {formatNumber(item.mediaDia, 2)}/d
                              </td>
                              <td className="py-3 px-3 text-center">
                                <span
                                  className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${item.ritmoClass}`}
                                >
                                  {item.ritmoLabel}
                                </span>
                              </td>
                            </>
                          )}

                          <td className="py-3 px-3 text-center">
                            <button
                              type="button"
                              onClick={() => handleRemoverItem(item.codigo)}
                              className="text-xs px-2.5 py-1 rounded bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/60 transition cursor-pointer"
                            >
                              Remover
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PromocoesDashboard />);
  </script>
</body>
</html>
