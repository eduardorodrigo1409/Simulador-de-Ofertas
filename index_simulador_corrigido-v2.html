    function toInputDate(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
    }

    function formatDatePtBr(dateStr) {
      const d = parseLocalDate(dateStr);
      if (!d) return "—";
      return d.toLocaleDateString("pt-BR");
    }

    function formatBRL(value) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatNumber(value, decimals = 0) {
      const num = Number.isFinite(value) ? value : 0;
      return num.toLocaleString("pt-BR", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function parsePtNumber(raw) {
      if (typeof raw === "number") return Number.isFinite(raw) ? raw : 0;
      if (!raw) return 0;
      const cleaned = String(raw)
        .replace(/R\$/gi, "")
        .replace(/\s+/g, "")
        .trim();
      if (!cleaned) return 0;
      if (cleaned.includes(",") && cleaned.includes(".")) {
        const val = Number(cleaned.replace(/\./g, "").replace(",", "."));
        return Number.isFinite(val) ? val : 0;
      }
      if (cleaned.includes(",")) {
        const val = Number(cleaned.replace(",", "."));
        return Number.isFinite(val) ? val : 0;
      }
      const val = Number(cleaned);
      return Number.isFinite(val) ? val : 0;
    }

    function normalizarItemEstoque(raw) {
      if (!raw || typeof raw !== "object") return null;
      const codigo = String(
        raw.codigo ?? raw.CODPROD ?? raw.sku ?? raw.id ?? ""
      ).trim();
      if (!codigo) return null;

      return {
        codigo,
        descricao: String(
          raw.descricao ?? raw.produto ?? raw.DESCRPROD ?? raw.nome ?? `SKU ${codigo}`
        ).trim(),
        grupo: String(
          raw.grupo ?? raw.GRUPOPROD ?? raw.categoria ?? "SANKHYA"
        ).trim(),
        custoUnit: parsePtNumber(
          raw.custoUnit ??
            raw.unidadeCusto ??
            raw.custo_unitario ??
            raw.custo ??
            raw.vlrCusto ??
            0
        ),
        estoqueDisp: parsePtNumber(
          raw.estoqueDisp ??
            raw.qtdDisponivel ??
            raw.qtd_disponivel ??
            raw.estoque ??
            raw.saldo ??
            0
        ),
      };
    }

    function extrairArrayDePayload(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object") {
        if (Array.isArray(data.itens)) return data.itens;
        if (Array.isArray(data.items)) return data.items;
        if (Array.isArray(data.produtos)) return data.produtos;
        if (Array.isArray(data.estoque)) return data.estoque;
        if (Array.isArray(data.dados)) return data.dados;
      }
      return [];
    }

    function calcPrecoFromMarkup(custo, markupPct) {
      const m = Number.isFinite(markupPct) ? markupPct : 0;
      return Math.max(0, Number((custo * (1 + m / 100)).toFixed(2)));
    }

    function calcMarkupFromPreco(custo, preco) {
      if (!custo || custo <= 0) return 0;
      return Number((((preco - custo) / custo) * 100).toFixed(2));
    }

    function calcMargemPct(preco, custo) {
      if (!preco || preco <= 0) return 0;
      return Number((((preco - custo) / preco) * 100).toFixed(1));
    }

    function criarItemPromocao(skuObj, markupInicial = 25, qtdOferta = 10) {
      const custo = Number(skuObj.custoUnit) || 0;
      const precoOferta = calcPrecoFromMarkup(custo, markupInicial);
      return {
        codigo: String(skuObj.codigo).trim(),
        descricao: String(skuObj.descricao || "").trim(),
        grupo: String(skuObj.grupo || "GERAL").trim(),
        estoqueDisp: Number(skuObj.estoqueDisp) || 0,
        custoUnit: custo,
        qtdOferta: Math.max(0, Number(qtdOferta) || 0),
        markupPct: Number(markupInicial) || 0,
        precoOferta,
      };
    }

    function parseTextoImportacaoSankhya(texto) {
      const linhas = String(texto || "")
        .split(/
?
/)
        .map((l) => l.trim())
        .filter(Boolean);

      if (linhas.length === 0) return [];

      const sep = linhas[0].includes("	")
        ? "	"
        : linhas[0].includes(";")
        ? ";"
        : ",";

      const resultados = [];

      linhas.forEach((linha, idx) => {
        const cols = linha.split(sep).map((c) => c.trim());
        if (cols.length < 2) return;

        const primeiroLower = cols[0].toLowerCase();
        if (
          idx === 0 &&
          (primeiroLower.includes("codigo") ||
            primeiroLower.includes("código") ||
            primeiroLower.includes("sku") ||
            primeiroLower === "#")
        ) {
          return;
        }

        const temColunaSeq =
          cols.length >= 6 &&
          /^\d+$/.test(cols[0]) &&
          /^\d+$/.test(cols[1]);

        const codigoIdx = temColunaSeq && cols.length >= 7 ? 1 : 0;
        const codigo = cols[codigoIdx]?.trim();
        if (!codigo) return;

        const descricao = cols[codigoIdx + 1]?.trim() || `Item SKU ${codigo}`;
        const grupo = cols[codigoIdx + 2]?.trim() || "SANKHYA";

        const numeros = cols.slice(codigoIdx + 3).map((c) => parsePtNumber(c));

        const custoUnit =
          numeros.length >= 2 ? numeros[numeros.length - 2] : numeros[0] || 0;
        const estoqueDisp =
          numeros.length >= 1 ? numeros[numeros.length - 1] : 0;

        resultados.push({
          codigo,
          descricao,
          grupo,
          custoUnit,
          estoqueDisp,
        });
      });

      return resultados;
    }

    function getStatusCampanha(dataInicio, dataFim) {
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);

      if (!inicio) {
        return {
          key: "sem_data",
          label: "Sem Data Início",
          badgeClass: "bg-slate-800 text-slate-300 border-slate-700",
          iniciada: false,
        };
      }

      if (hoje < inicio) {
        return {
          key: "agendada",
          label: "Agendada",
          badgeClass: "bg-sky-950/80 text-sky-300 border-sky-700/60",
          iniciada: false,
        };
      }

      if (fim && hoje > fim) {
        return {
          key: "encerrada",
          label: "Encerrada",
          badgeClass: "bg-amber-950/80 text-amber-300 border-amber-700/60",
          iniciada: true,
        };
      }

      return {
        key: "ativa",
        label: "Em Andamento",
        badgeClass: "bg-emerald-950/80 text-emerald-300 border-emerald-600/60",
        iniciada: true,
      };
    }

    function getDiasDecorridos(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      if (!inicio) return 0;

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      if (hoje < inicio) return 0;

      const fim = parseLocalDate(dataFim);
      const limite = fim && hoje > fim ? fim : hoje;
      const diffMs = limite.getTime() - inicio.getTime();
      return Math.max(1, Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1);
    }

    function getDiasTotaisCampanha(dataInicio, dataFim) {
      const inicio = parseLocalDate(dataInicio);
      const fim = parseLocalDate(dataFim);
      if (!inicio || !fim || fim < inicio) return null;
      const diffMs = fim.getTime() - inicio.getTime();
      return Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
    }

    function exportarCsvPromocao({
      nomePromocao,
      dataInicio,
      dataFim,
      linhasPerformance,
      iniciada,
    }) {
      const headers = [
        "Campanha",
        "Data Inicio",
        "Data Fim",
        "Codigo SKU",
        "Descricao",
        "Grupo",
        "Estoque Disp.",
        "Custo Unit. (R$)",
        "Qtd Oferta",
        "Markup (%)",
        "Preco Oferta (R$)",
        "Margem Oferta (%)",
        "Total Oferta (R$)",
        ...(iniciada
          ? [
              "Qtd Vendida",
              "% Atingido",
              "Saldo Restante",
              "Media Venda/Dia",
              "Receita Realizada (R$)",
              "Ritmo",
            ]
          : []),
      ];

      const escapeCsv = (val) => {
        const str = String(val ?? "");
        if (str.includes(";") || str.includes('"') || str.includes("\\n")) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      const rows = linhasPerformance.map((item) => [
        nomePromocao || "Promocao sem nome",
        dataInicio || "",
        dataFim || "",
        item.codigo,
        item.descricao,
        item.grupo,
        item.estoqueDisp,
        item.custoUnit.toFixed(2).replace(".", ","),
        item.qtdOferta,
        item.markupPct.toFixed(2).replace(".", ","),
        item.precoOferta.toFixed(2).replace(".", ","),
        item.margemPct.toFixed(1).replace(".", ","),
        item.totalOferta.toFixed(2).replace(".", ","),
        ...(iniciada
          ? [
              item.qtdVendida,
              item.pctAtingido.toFixed(1).replace(".", ","),
              item.saldoRestante,
              item.mediaDia.toFixed(2).replace(".", ","),
              item.receitaRealizada.toFixed(2).replace(".", ","),
              item.ritmoLabel,
            ]
          : []),
      ]);

      const csvContent =
        "﻿" +
        [headers, ...rows]
          .map((row) => row.map(escapeCsv).join(";"))
          .join("
");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const slug = (nomePromocao || "promocao")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      link.href = url;
      link.setAttribute("download", `${slug || "promocao"}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

        try {
          if (window.location.hash && window.location.hash.startsWith("#todos=")) {
            const rawHash = decodeURIComponent(window.location.hash.slice(7));
            aplicarPayloadExterno(JSON.parse(rawHash), false, "Hash URL (Todos os Itens)");
          } else if (window.location.hash && window.location.hash.startsWith("#dados=")) {
            const rawHash = decodeURIComponent(window.location.hash.slice(7));
            aplicarPayloadExterno(JSON.parse(rawHash), true, "Excesso para Queima");

          const allStockRaw = localStorage.getItem(ALL_STOCK_PAYLOAD_KEY);
          if (allStockRaw) {
            const parsedAll = JSON.parse(allStockRaw);
            const arrAll = extrairArrayDePayload(parsedAll);
            if (arrAll.length > 0) {
              sincronizarCatalogoCompleto(

              );

          }

          const bridgeRaw = localStorage.getItem(BRIDGE_PAYLOAD_KEY);
          if (bridgeRaw) {
            const parsedBridge = JSON.parse(bridgeRaw);
            const arrBridge = extrairArrayDePayload(parsedBridge);
            if (arrBridge.length > 0) {
              aplicarPayloadExterno(arrBridge, true, "Excesso para Queima");
              localStorage.removeItem(BRIDGE_PAYLOAD_KEY);
            }
          }
        } catch {
          // ignora erro de leitura inicial
        }

        const handleMessage = (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== "object") return;
          if (msg.tipo === "SYNC_ESTOQUE_COMPLETO" || msg.type === "SYNC_ESTOQUE_COMPLETO") {
            const qtd = sincronizarCatalogoCompleto(
              msg.itens || msg.dados || [],
              msg.origem || "Dash Apuração de Estoque"
            );
            if (qtd > 0) {
              setFeedback({
                type: "success",
                text: `Sincronização automática: ${qtd} item(ns) recebidos do Dash de Apuração de Estoque.`,
              });
            }
          } else if (
            msg.tipo === "ENVIAR_QUEIMA" ||
            msg.type === "ENVIAR_QUEIMA" ||
            msg.tipo === "CARREGAR_PROMOCAO"
          ) {
            aplicarPayloadExterno(
              msg.itens || msg.dados || [],
              true,
              msg.origem || "Excesso para Queima"
            );
          }
        };

        const handleStorageEvent = (event) => {
          if (event.key === ALL_STOCK_PAYLOAD_KEY && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              const qtd = sincronizarCatalogoCompleto(
                extrairArrayDePayload(parsed),

              if (qtd > 0) {
                setFeedback({
                  type: "success",
                  text: `Lista completa atualizada: ${qtd} item(ns) do Dash de Apuração de Estoque.`,
                });
              }
            } catch {
              // ignora
            }
          } else if (event.key === BRIDGE_PAYLOAD_KEY && event.newValue) {
            try {
              const parsed = JSON.parse(event.newValue);
              aplicarPayloadExterno(
                extrairArrayDePayload(parsed),
                true,
                "Excesso para Queima"
              );
            } catch {
              // ignora
            }
          }
        };

        window.addEventListener("message", handleMessage);
        window.addEventListener("storage", handleStorageEvent);
        return () => {
          window.removeEventListener("message", handleMessage);
          window.removeEventListener("storage", handleStorageEvent);
        };

        try {

          if (!resp.ok) {
            showNotice("error", `Falha ao buscar URL (${resp.status}).`);
            return;
          }
          const data = await resp.json();
          const qtd = sincronizarCatalogoCompleto(data, "Endpoint de Estoque");
          if (qtd > 0) {
            showNotice(
              "success",
              `Sincronização concluída: ${qtd} item(ns) carregados no catálogo a partir da URL.`
            );

        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        const fim = parseLocalDate(dataFim);
        const hoje = new Date();
        hoje.setHours(23, 59, 59, 999);
        const limiteSuperior = fim
          ? new Date(fim.getFullYear(), fim.getMonth(), fim.getDate(), 23, 59, 59, 999)
          : hoje;

        return vendas.filter((v) => {
          const dt = parseLocalDate(v.data);
          if (!dt || !inicio) return false;
          return dt >= inicio && dt <= limiteSuperior;
        });
      }, [vendas, statusCampanha.iniciada, dataInicio, dataFim]);

          const margemPct = calcMargemPct(item.precoOferta, item.custoUnit);

          const vendasSku = statusCampanha.iniciada
            ? vendasNoPeriodo.filter((v) => v.codigo === item.codigo)
            : [];

          const qtdVendida = vendasSku.reduce(
            (acc, v) => acc + (Number(v.qtd) || 0),
            0
          );
          const receitaRealizada = vendasSku.reduce(
            (acc, v) =>
              acc + (Number(v.qtd) || 0) * (Number(v.precoPraticado) || item.precoOferta),
            0
          );
          const custoRealizado = qtdVendida * item.custoUnit;
          const lucroRealizado = receitaRealizada - custoRealizado;
          const margemRealizadaPct =
            receitaRealizada > 0
              ? Number(
                  (((receitaRealizada - custoRealizado) / receitaRealizada) * 100).toFixed(

                  )
                )
              : 0;

          const pctAtingido =

          const mediaDia =
            diasDecorridos > 0 ? Number((qtdVendida / diasDecorridos).toFixed(2)) : 0;

          const ritmoEsperadoDia =
            diasTotais && diasTotais > 0 && item.qtdOferta > 0
              ? item.qtdOferta / diasTotais
              : 0.5;

          let ritmoKey = "sem_saida";
          let ritmoLabel = "Sem saída";
          let ritmoClass = "bg-slate-800 text-slate-400 border-slate-700";

          if (qtdVendida > 0) {
            if (mediaDia >= ritmoEsperadoDia * 1.15) {
              ritmoKey = "acelerado";
              ritmoLabel = "Acelerado";
              ritmoClass = "bg-emerald-950/80 text-emerald-300 border-emerald-700/60";
            } else if (mediaDia >= ritmoEsperadoDia * 0.65) {
              ritmoKey = "no_ritmo";
              ritmoLabel = "No ritmo";
              ritmoClass = "bg-sky-950/80 text-sky-300 border-sky-700/60";

              ritmoKey = "lento";
              ritmoLabel = "Lento";
              ritmoClass = "bg-amber-950/80 text-amber-300 border-amber-700/60";
            }
          }

            ...item,
            totalOferta,
            custoTotalItem,
            margemPct,
            qtdVendida,
            pctAtingido,
            saldoRestante,
            mediaDia,
            receitaRealizada,
            lucroRealizado,
            margemRealizadaPct,
            ritmoKey,
            ritmoLabel,
            ritmoClass,
          };
        });
      }, [itens, statusCampanha.iniciada, vendasNoPeriodo, diasDecorridos, diasTotais]);

      const kpisLote = useMemo(() => {
        const totalSkus = itens.length;
        const totalUnidadesOfertadas = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0),
          0
        );
        const custoTotalLote = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.custoUnit) || 0),
          0
        );
        const receitaPotencial = itens.reduce(
          (acc, i) => acc + (Number(i.qtdOferta) || 0) * (Number(i.precoOferta) || 0),
          0
        );
        const lucroBrutoPotencial = receitaPotencial - custoTotalLote;
        const margemMediaPotencial =
          receitaPotencial > 0
            ? Number(((lucroBrutoPotencial / receitaPotencial) * 100).toFixed(1))
            : 0;

        return {
          totalSkus,
          totalUnidadesOfertadas,
          custoTotalLote,
          receitaPotencial,
          lucroBrutoPotencial,
          margemMediaPotencial,
        };
      }, [itens]);

      const kpisSaida = useMemo(() => {
        const unidadesVendidas = linhasPerformance.reduce(
          (acc, l) => acc + l.qtdVendida,
          0
        );
        const pctEsgotamento =
          kpisLote.totalUnidadesOfertadas > 0
            ? Number(
                ((unidadesVendidas / kpisLote.totalUnidadesOfertadas) * 100).toFixed(1)
              )
            : 0;
        const saldoTotalRestante = Math.max(
          0,
          kpisLote.totalUnidadesOfertadas - unidadesVendidas
        );
        const receitaRealizada = linhasPerformance.reduce(
          (acc, l) => acc + l.receitaRealizada,
          0
        );
        const lucroRealizado = linhasPerformance.reduce(
          (acc, l) => acc + l.lucroRealizado,
          0
        );
        const margemRealizada =
          receitaRealizada > 0
            ? Number(((lucroRealizado / receitaRealizada) * 100).toFixed(1))
            : 0;
        const ritmoMedioDia =
          diasDecorridos > 0
            ? Number((unidadesVendidas / diasDecorridos).toFixed(1))
            : 0;

        return {
          unidadesVendidas,
          pctEsgotamento,
          saldoTotalRestante,
          receitaRealizada,
          lucroRealizado,
          margemRealizada,
          ritmoMedioDia,
        };
      }, [linhasPerformance, kpisLote.totalUnidadesOfertadas, diasDecorridos]);

      const serieDiariaSaida = useMemo(() => {
        if (!statusCampanha.iniciada || !dataInicio) return [];
        const inicio = parseLocalDate(dataInicio);
        if (!inicio) return [];

        const skusPromocaoSet = new Set(itens.map((i) => i.codigo));
        const mapaDia = new Map();

        for (let i = 0; i < diasDecorridos; i++) {
          const d = new Date(inicio);
          d.setDate(d.getDate() + i);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const key = `${y}-${m}-${day}`;
          mapaDia.set(key, {
            data: key,
            label: `${day}/${m}`,
            unidades: 0,
            receita: 0,
          });
        }

        vendasNoPeriodo.forEach((v) => {
          if (!skusPromocaoSet.has(v.codigo)) return;
          const bucket = mapaDia.get(v.data);
          if (bucket) {
            const qtd = Number(v.qtd) || 0;
            const preco = Number(v.precoPraticado) || 0;
            bucket.unidades += qtd;
            bucket.receita += qtd * preco;
          }
        });

        const lista = Array.from(mapaDia.values());
        const maxUnidades = Math.max(1, ...lista.map((x) => x.unidades));
        return lista.map((x) => ({
          ...x,
          alturaPct: Math.max(8, Math.round((x.unidades / maxUnidades) * 100)),
        }));

          if (somenteComSaida && item.qtdVendida <= 0) return false;

                          <div
                            key={dia.data}
                            className="flex-1 flex flex-col items-center justify-end h-full group"
                            title={`${dia.label}: ${dia.unidades} un. (${formatBRL(
                              dia.receita
                            )})`}
                          >
                            <span className="text-[10px] text-slate-400 mb-0.5">
                              {dia.unidades}
                            </span>
                            <div
                              className="w-full rounded-t bg-amber-400/85 group-hover:bg-amber-300 transition-all"
                              style={{ height: `${dia.alturaPct}%` }}
                            />
                            <span className="text-[10px] text-slate-500 mt-1">
                              {dia.label}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <form
                    onSubmit={handleRegistrarVendaSimulada}
                    className="bg-[#080d18] border border-slate-800/90 rounded-xl p-3.5 flex flex-col lg:flex-row lg:items-end justify-between gap-3"
                  >
                    <div className="text-xs text-slate-400">
                      <strong className="text-slate-200 block text-sm">
                        Simulador de Saída / Venda
                      </strong>
                      Registre vendas em datas a partir do início da promoção para
                      ver o comportamento atualizar em tempo real.
                    </div>

                    <div className="flex flex-wrap items-end gap-2.5">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          SKU
                        </label>
                        <select
                          value={simSku}
                          onChange={(e) => setSimSku(e.target.value)}
                          className="bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        >
                          {Object.values(catalogoSankhya).map((s) => (
                            <option key={s.codigo} value={s.codigo}>
                              {s.codigo} — {s.descricao}
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          Qtd Vendida
                        </label>
                        <input
                          type="number"
                          min="1"
                          value={simQtd}
                          onChange={(e) => setSimQtd(e.target.value)}
                          className="w-24 bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">
                          Data da Venda
                        </label>
                        <input
                          type="date"
                          value={simData}
                          onChange={(e) => setSimData(e.target.value)}
                          className="bg-[#0e1525] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        />
                      </div>

                      <button
                        type="submit"
                        className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition cursor-pointer"
                      >
                        + Registrar Venda
                      </button>
                    </div>
                  </form>
                </>
              ) : (
                <div className="bg-[#080d18] border border-slate-800/80 rounded-xl p-4 text-sm text-slate-400">
                  A promoção ainda não iniciou ({statusCampanha.label}). Assim que a
                  data atual atingir a Data de Início, os indicadores de saída,
                  receita realizada, margem e ritmo serão exibidos aqui.
                </div>
              )}
            </div>

            <div className="bg-[#0e1525] border border-slate-800/90 rounded-2xl p-5 space-y-4">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div>
                  <h2 className="text-base md:text-lg font-bold text-white">
                    Itens da Promoção & Performance de Saída
                  </h2>
                  <p className="text-xs text-slate-400">
                    Ajuste quantidade ofertada, markup ou preço unitário direto na
                    tabela e acompanhe a saída de cada item.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <select
                    value={filtroGrupo}
                    onChange={(e) => setFiltroGrupo(e.target.value)}
                    className="bg-[#080d18] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
                  >
                    {gruposDisponiveis.map((g) => (
                      <option key={g} value={g}>
                        {g === "TODOS" ? "Todos os grupos" : g}
                      </option>
                    ))}
                  </select>

                  <label className="flex items-center gap-1.5 text-xs text-slate-300 bg-[#080d18] border border-slate-700 rounded-lg px-2.5 py-1.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={somenteComSaida}
                      onChange={(e) => setSomenteComSaida(e.target.checked)}
                    />
                    Somente com saída
                  </label>

                  <button
                    type="button"
                    onClick={() =>
                      exportarCsvPromocao({
                        nomePromocao,
                        dataInicio,
                        dataFim,
                        linhasPerformance: itensFiltrados,
                        iniciada: statusCampanha.iniciada,
                      })
                    }
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 transition cursor-pointer"
                  >
                    Exportar CSV
                  </button>

                  {itens.length > 0 && (
                    <button
                      type="button"
                      onClick={handleLimparLista}
                      className="px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 transition cursor-pointer"
                    >
                      Limpar Itens
                    </button>
                  )}
                </div>
              </div>

              <div className="overflow-x-auto rounded-xl border border-slate-800">
                <table className="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr className="bg-[#080d18] text-slate-400 border-b border-slate-800 uppercase tracking-wider">
                      <th className="py-3 px-3">SKU</th>
                      <th className="py-3 px-3">Descrição / Grupo</th>
                      <th className="py-3 px-3 text-right">Est. Disp.</th>
                      <th className="py-3 px-3 text-right">Custo Unit.</th>
                      <th className="py-3 px-3 text-right">Qtd Oferta</th>
                      <th className="py-3 px-3 text-right">Markup %</th>
                      <th className="py-3 px-3 text-right">Preço Oferta</th>
                      <th className="py-3 px-3 text-right">Margem %</th>
                      <th className="py-3 px-3 text-right">Total Oferta</th>
                      {statusCampanha.iniciada && (
                        <>
                          <th className="py-3 px-3 text-right">Vendida</th>
                          <th className="py-3 px-3 text-right">% Ating.</th>
                          <th className="py-3 px-3 text-right">Saldo</th>
                          <th className="py-3 px-3 text-right">Média/Dia</th>
                          <th className="py-3 px-3 text-right">Receita Real.</th>
                          <th className="py-3 px-3 text-center">Ritmo</th>
                        </>
                      )}
                      <th className="py-3 px-3 text-center">Ação</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70">
                    {itensFiltrados.length === 0 ? (
                      <tr>
                        <td
                          colSpan={statusCampanha.iniciada ? 16 : 10}
                          className="py-8 px-4 text-center text-slate-400"
                        >
                          Nenhum item na promoção para o filtro selecionado. Digite um
                          código de SKU acima ou sincronize/importe itens.
                        </td>
                      </tr>
                    ) : (
                      itensFiltrados.map((item) => (
                        <tr
                          key={item.codigo}
                          className="hover:bg-slate-900/40 transition-colors"
                        >
                          <td className="py-2.5 px-3 font-mono font-bold text-amber-300 whitespace-nowrap">
                            {item.codigo}
                          </td>
                          <td className="py-2.5 px-3">
                            <div className="font-medium text-slate-100">
                              {item.descricao}
                            </div>
                            <div className="text-[11px] text-slate-400">
                              {item.grupo}
                            </div>
                          </td>
                          <td className="py-2.5 px-3 text-right font-mono text-slate-300 whitespace-nowrap">
                            {formatNumber(item.estoqueDisp, 2)}
                          </td>
                          <td className="py-2.5 px-3 text-right font-mono text-slate-300 whitespace-nowrap">
                            {formatBRL(item.custoUnit)}
                          </td>
                          <td className="py-2.5 px-3 text-right whitespace-nowrap">
                            <input
                              type="number"
                              min="0"
                              step="1"
                              value={item.qtdOferta}
                              onChange={(e) =>
                                handleAtualizarQtdOferta(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right font-mono text-white outline-none"
                            />
                          </td>
                          <td className="py-2.5 px-3 text-right whitespace-nowrap">
                            <input
                              type="number"
                              step="0.5"
                              value={item.markupPct}
                              onChange={(e) =>
                                handleAtualizarMarkupItem(item.codigo, e.target.value)
                              }
                              className="w-20 bg-[#080d18] border border-slate-700 focus:border-amber-400 rounded px-2 py-1 text-right font-mono text-amber-300 outline-none"
                            />
                          </td>
                          <td className="py-2.5 px-3 text-right whitespace-nowrap">
                            <input
                              type="number"
                              min="0"
                              step="0.01"
                              value={item.precoOferta}
                              onChange={(e) =>
                                handleAtualizarPrecoOferta(item.codigo, e.target.value)
                              }
                              className="w-24 bg-[#080d18] border border-slate-700 focus:border-emerald-400 rounded px-2 py-1 text-right font-mono text-emerald-300 outline-none"
                            />
                          </td>
                          <td className="py-2.5 px-3 text-right font-mono text-slate-300 whitespace-nowrap">
                            {item.margemPct.toFixed(1)}%
                          </td>
                          <td className="py-2.5 px-3 text-right font-mono font-semibold text-white whitespace-nowrap">
                            {formatBRL(item.totalOferta)}
                          </td>
                          {statusCampanha.iniciada && (
                            <>
                              <td className="py-2.5 px-3 text-right font-mono text-emerald-400 whitespace-nowrap">
                                {formatNumber(item.qtdVendida)}
                              </td>
                              <td className="py-2.5 px-3 text-right font-mono text-slate-200 whitespace-nowrap">
                                {item.pctAtingido.toFixed(1)}%
                              </td>
                              <td className="py-2.5 px-3 text-right font-mono text-slate-300 whitespace-nowrap">
                                {formatNumber(item.saldoRestante)}
                              </td>
                              <td className="py-2.5 px-3 text-right font-mono text-slate-300 whitespace-nowrap">
                                {formatNumber(item.mediaDia, 2)}
                              </td>
                              <td className="py-2.5 px-3 text-right font-mono text-emerald-300 whitespace-nowrap">
                                {formatBRL(item.receitaRealizada)}
                              </td>
                              <td className="py-2.5 px-3 text-center whitespace-nowrap">
                                <span
                                  className={`inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full border ${item.ritmoClass}`}
                                >
                                  {item.ritmoLabel}
                                </span>
                              </td>
                            </>
                          )}
                          <td className="py-2.5 px-3 text-center whitespace-nowrap">
                            <button
                              type="button"
                              onClick={() => handleRemoverItem(item.codigo)}
                              className="px-2 py-1 rounded text-[11px] bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 border border-rose-800/60 cursor-pointer"
                            >
                              Remover
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const rootEl = document.getElementById("root");
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<PromocoesDashboard />);
    }
  </script>
</body>
</html>
